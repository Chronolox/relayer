  /api/secrets/info/{id}:
    get:
      tags:
      - Secrets
      summary: Get secret info by ID
      operationId: getSecretInfo
      description: "Returns detailed information about a secret including the secretSalt.\n\
        The secretSalt is a 16-byte hex string used for deriving recipient-specific\n\
        salts in multi-recipient secrets.\n\nThis endpoint queries the events database\
        \ for the most recent event\nmatching the given secret ID.\n\n## On-demand\
        \ peer resolution & recursion guard\n\nIf the secret is missing locally or\
        \ only stored with a placeholder transaction\nhash, the relayer resolves it\
        \ on demand from eligible peer relayers\n(`GET /api/records` first, then `GET\
        \ /api/secrets/info/{id}` as fallback) and\npersists the recovered event before\
        \ answering. The whole resolution is bounded\nby a 3-second timeout; each\
        \ individual peer call by 5 seconds.\n\n**Relayer-to-relayer callers MUST\
        \ send `X-No-Peer-Resolve: true`.** A receiving\nrelayer that sees this header\
        \ (or valid relayer signature headers) serves local\ndata only and never triggers\
        \ its own peer resolution \u2014 this breaks the mutual\nrecursive fan-out\
        \ loop that previously exhausted origin connections when\nmultiple relayers\
        \ queried a secret none of them held. End-user clients never\nsend the header\
        \ and get the full on-demand resolution behavior.\n"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The secret ID (hex string, with or without 0x prefix)
        example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
      responses:
        '200':
          description: Secret info retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInfoResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  secret_id: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                  event_name: SecretCreatedFromGateway
                  unlock_time: 1709817600
                  secret_salt_s: '0x0123456789abcdef0123456789abcdef'
                  secret_salt_a: '0xfedcba9876543210fedcba9876543210'
                  status: delivered
                  is_frozen: false
                  store_approvals: false
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.2
                error: Secret not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sapphire/public-keys:
    get:
      security: []
      tags:
      - Sapphire
      summary: Get TEE public keys for encryption
      operationId: getSapphirePublicKeys
      description: 'Returns the X25519 and ML-KEM-1024 public keys from the Sapphire
        TEE.

        Required for encrypting secret content before creating a secret.


        The X25519 key is used for NaCl-style encryption (X25519 + XSalsa20-Poly1305).

        The ML-KEM-1024 key is used for hybrid KEM encryption (Kyber1024 + X25519).


        Returns cached values with a 5-minute freshness guarantee.


        This endpoint is public and does not require any authentication.


        ## Usage


        Clients call this endpoint before creating a secret to obtain the current

        public keys for encrypting the secret content. The keys are fetched from the

        Sapphire contract''s `getPublicKeys()` method.


        The `x25519_key` is always present (32 bytes). The `kyber_key` may be

        empty or null if the Sapphire contract doesn''t support post-quantum

        encryption yet.

        '
      responses:
        '200':
          description: Public keys retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapphirePublicKeysResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  x25519_key: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                  kyber_key: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                  fetched_at: 1709817600
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/secrets/gateway-history/{id}:
    get:
      tags:
