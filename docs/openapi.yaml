  /api/reprocess/gateway:
    post:
      tags:
      - Events
      summary: Force reprocessing/capture of a gateway transaction to Sapphire
      operationId: reprocessGateway
      description: 'Forces the relayer to capture a gateway transaction from the blockchain
        if not yet in the database,

        determine if it needs to be processed to Sapphire, and if so, submit it to
        Sapphire.


        ### Direct Mode Workflow & Load Balancing

        1. **Direct Gateway Execution**: The user/CLI performs a create, update, or
        cancel operation directly on the Polygon Gateway, paying the transaction gas
        locally.

        2. **Random Relayer Selection**: To ensure fair load distribution and prevent
        overloading a single relayer, the CLI queries the SDK registry for all active/operational
        relayers, and randomly selects one.

        3. **Reprocess Trigger**: The CLI sends a `POST` request to the selected relayer''s
        `/api/reprocess/gateway` endpoint with the `secretId` and the `txHash` (Gateway
        transaction ID).

        4. **Shard Bypass & Authorization**: Normally, relayers coordinate processing
        priority using a sharding scheme. Calling this endpoint on the selected relayer
        forces it to bypass its shard priority check and immediately assume responsibility
        for executing the Sapphire transaction.

        5. **Validation and Execution**: The relayer retrieves the transaction receipt
        from Polygon to validate it. It then checks on-chain (using read-only Sapphire
        queries) to verify if the Sapphire transaction already exists. If not, it
        executes the confidential Sapphire transaction.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessGatewayRequest'
            example:
              secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
              txHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
      responses:
        '200':
          description: Force reprocessing completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessGatewayResult'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  success: true
                  status: completed
                  sapphire_tx_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                  message: Secret already delivered to Sapphire
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
