  /api/secrets/access:
    post:
      tags:
      - Secrets
      summary: Gasless Secret Access
      operationId: accessSecret
      description: "Core endpoint for recipient (heir) access to a secret. Enables\
        \ retrieval of the encrypted\nsecret payload and associated encrypted Shamir\
        \ shares without requiring the recipient\nto hold cryptocurrency or interact\
        \ directly with the blockchain.\n\nThis endpoint implements a password-based\
        \ authentication scheme combined with\nTrusted Execution Environment (TEE)\
        \ verification and relayer-mediated gas abstraction.\n\n## Cryptographic model\n\
        \nEach recipient is assigned:\n- A password (distributed off-chain by the\
        \ creator)\n- Two salts:\n  - `salt_A` (authentication)\n  - `salt_S` (share\
        \ decryption)\n\nAuthentication is based on:\n  Auth = Argon2id(password,\
        \ salt_A)\n  Stored on-chain as: keccak256(Auth)\n\nShamir shares are protected\
        \ independently using:\n  key = Argon2id(password, salt_S)\n\nThe relayer\
        \ and blockchain never receive the password or decryption keys.\n\n## Access\
        \ flow\n\n1. The client retrieves public parameters (`salt_A`, `salt_S`) from\
        \ the relayer or chain.\n\n2. The client derives:\n    argon2Hash = Argon2id(password,\
        \ salt_A)\n\n3. The relayer performs preliminary checks:\n    - Unlock time\
        \ pre-validation\n    - Rate limiting\n    - Request structure validation\n\
        \n  The relayer does not verify the password or derive any secrets.\n\n4.\
        \ The relayer forwards the encrypted payload to the Sapphire contract\n  (`accessSecret`)\
        \ and pays the execution gas.\n\n5. Inside the TEE, the following validations\
        \ are enforced:\n\n  - Authentication check:\n      keccak256(argon2Hash)\
        \ == stored Auth hash\n\n6. If all checks pass, the TEE returns:\n    - The\
        \ encrypted secret payload\n    - The set of encrypted Shamir shares `[Enc(s\u2081\
        ), Enc(s\u2082), ...]`\n\n## Client-side reconstruction\n\nAfter receiving\
        \ the response, the client:\n\n1. Derives the share decryption key:\n    key\
        \ = Argon2id(password, salt_S)\n\n2. Attempts decryption of each encrypted\
        \ share:\n    Enc(s\u1D62) \u2192 s\u1D62 (only one will succeed)\n\n3. Collaborates\
        \ off-chain with other recipients (if required by threshold)\n  to reconstruct\
        \ the original `content_key` via Shamir.Combine.\n\n4. Decrypts the secret\
        \ using the reconstructed `content_key`.\n\n## Security properties\n\n- The\
        \ password is never transmitted or exposed.\n- Authentication and decryption\
        \ use separate salts and derivations.\n- The relayer cannot impersonate recipients\
        \ or derive shares.\n- Requests are bound to a specific relayer instance.\n\
        - Secret access is enforced inside a TEE, not at the API layer.\n\n## Relayer\
        \ responsibilities\n\n- Gas sponsorship for TEE execution\n- Request forwarding\
        \ and availability\n- Basic anti-abuse protections:\n  - Rate limiting (per\
        \ recipient / vault)\n  - Unlock time pre-check\n  - Access count limits\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessSecretRequest'
            example:
              secretId: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
              authValue: '0x1234567890abcdef'
      responses:
        '200':
          description: Secret content retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSecretData'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  content: '0xdeadbeef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/secrets/status:
    get:
      tags:
      - Secrets
      summary: Get Secret Status from Sapphire
      operationId: getSecretStatus
      description: "Queries the SecretVaultSapphire contract directly (not the local\
        \ database) to\ncheck if a secret exists on-chain and its current lifecycle\
        \ status.\n\nCalls the Solidity view function `getSecretStatus(bytes32)` which\
        \ returns:\n- `exists`: whether a secret with this ID has ever been created\n\
        - `status`: the current SecretStatus enum value\n\n**SecretStatus enum:**\n\
        - `0` = Locked (initial state after creation, unlock time not yet reached)\n\
        - `1` = Unlocked (unlock time reached, secret is retrievable)\n- `2` = Cancelled\
        \ (cancelled by owner before unlock)\n- `3` = Viewed (secret content was accessed/read\
        \ by a recipient)\n- `4` = WindowExpired (access window deadline has passed)\n\
        \n**\u26A0\uFE0F Gas-saving pre-flight check:** Always call this endpoint\
        \ **before**\nattempting any of these gas-expensive operations:\n- `POST /api/secrets/access`\
        \ (costs ROSE gas on Sapphire)\n- `POST /api/voucher/secret/cancel` (costs\
        \ POL + ROSE gas)\n- `POST /api/voucher/secret/update` (costs POL + ROSE gas)\n\
        - `POST /api/reprocess/{txHash}` (costs ROSE gas)\n\nIf `exists` is `false`,\
        \ there is no secret on Sapphire \u2014 skip the\nexpensive operation and\
        \ avoid wasting gas. If `status` is `Cancelled`,\n`Viewed`, or `WindowExpired`,\
        \ certain operations may fail or be pointless.\n\nThis endpoint makes an `eth_call`\
        \ (a free read) to Sapphire. It does NOT\nquery the relayer's local event\
        \ database, so it reflects the authoritative\non-chain state even if the relayer\
        \ has not yet synced the event.\n\n**\u26A0\uFE0F Cross-chain delay:** Secret\
        \ operations (create, update, cancel,\naccess) originate on a Gateway chain\
        \ (Polygon/BSC/Arbitrum) and are\nonly relayed to Sapphire asynchronously\
        \ by the relayer. This means the\nSapphire status may lag behind the Gateway\
        \ state by up to a few minutes:\n- A secret cancelled on the Gateway may still\
        \ show `status: 0` (Locked)\n  on Sapphire until the relayer processes the\
        \ cancellation event.\n- A secret created on the Gateway may show `exists:\
        \ false` until the\n  relayer delivers it to Sapphire.\n\nIf you need the\
        \ Gateway-side status (i.e. the Polygon event history),\nuse `/api/events/secret/{secretId}`\
        \ or `/api/secrets/info/{id}` instead,\nwhich query the relayer's local event\
        \ database.\n"
      parameters:
      - name: secretId
        in: query
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        description: Secret ID (bytes32 hex, 64 hex chars + 0x prefix)
        example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
      responses:
        '200':
          description: Secret status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretStatusResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  exists: true
                  status: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/secrets/autocomplete:
    get:
      tags:
      - Secrets
      summary: Autocomplete Secret IDs
      operationId: getAutocompleteSecretIds
      x-cache:
        ttl-seconds: 180
        description: Responses are cached for 3 minutes to reduce database load. The
          timestamp field reflects when the response was originally generated.
      description: 'Returns a list of up to 6 secret IDs that start with the provided
        prefix.

        A minimum of 2 characters (not including 0x) is required for the prefix.

        This is used for autocomplete functionality in the recipient''s UI.


        **Caching:** Responses are cached for 3 minutes (180 seconds). Within this

        window, identical requests return the same signed response including the

        original timestamp. This reduces database queries and ECDSA signing overhead.

        The cache key includes the full query string, so different prefixes are

        cached independently.

        '
      parameters:
