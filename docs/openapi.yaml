        \ provides the complete cross-chain\noperation history including gateway transaction\
        \ IDs, operation types, timestamps,\ngateway message hashes, and chain IDs.\n\
        \nThe history includes all operations performed on the secret:\n- Create operations\
        \ (from Gateway)\n- Update operations (from Gateway)  \n- Cancel operations\
        \ (from Gateway)\n- Access operations (on Sapphire)\n- Destroy operations\
        \ (on Sapphire)\n\nEach history record contains:\n- `op_type`: Operation type\
        \ (0=Access, 1=Create, 2=Update, 3=Cancel, 4=Destroy)\n- `timestamp`: Block\
        \ timestamp when the operation occurred\n- `actor`: Address that performed\
        \ the operation (relayer or direct caller)\n- `gateway_message_hash`: Gateway\
        \ message hash for cross-chain correlation\n- `gateway_chain_id`: Origin EVM\
        \ chain ID (e.g., 80002 for Polygon Amoy)\n"
