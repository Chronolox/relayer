  /api/voucher/secret/cancel:
    post:
      tags:
      - Vouchers
      summary: Cancel Secret for Voucher User
      operationId: voucherCancelSecret
      description: "Permanently revokes a time-locked secret on behalf of a voucher\
        \ user. The relayer\nsponsors POL gas and deducts `PricingRegistry.cancelPriceUsd`\
        \ (~$1.00 USDC) from the\nuser's `CreditLedger` balance. Cancellation is irreversible\
        \ \u2014 after this call the\nSapphire TEE sets the secret status to `Cancelled`\
        \ and all future access attempts are\nrejected.\n\n**Sapphire TEE constraints\
        \ (authoritative):**\n- `isFrozen = true` \u2192 cancellation is permanently\
        \ blocked; call reverts. Frozen secrets\n  give recipients a cryptographic\
        \ guarantee that the creator cannot revoke access.\n- `isFlash = true` \u2192\
        \ cancellation is permanently blocked. Flash secrets cannot be\n  cancelled\
        \ by design (they expire naturally after their short unlock window).\n- Only\
        \ the original creator (`userWallet == secret.creator`) may cancel.\n- Only\
        \ possible **before** `unlockTime`. Once the time-lock has expired, the creator\n\
        \  loses the right to cancel \u2014 the secret is already accessible to the\
        \ recipient.\n\nHTTP 402 is returned if the `CreditLedger` balance is below\
        \ the cancellation fee.\n\n**Note on `cancelSecret()` being paid (v6+):**\
        \ Prior to Gateway v6 cancellation was free.\nThe fee now applies on both\
        \ the direct-wallet path and this relayed path.\n\n## Effective size limit\n\
        \nThe server enforces a 128 KiB cap on the entire request body of this endpoint\
        \ (checked\nbefore validation) and returns HTTP 413 when it is exceeded; the\
        \ practical ceiling is\nthe body cap, not the schema-level field constraints.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherCancelSecretRequest'
            example:
              userWallet: '0x1234567890123456789012345678901234567890'
              signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
              nonce: 42
              deadline: 1735690200
              network: polygonAmoy
              secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      responses:
        '200':
          description: Secret cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherSecretResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  submissionId: cancel-1234567890abcdef
                  secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  status: cancelled
                  polygonTxHash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  sapphireTxHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/journal/entry:
    post:
      tags:
      - Journal
      - Vouchers
      summary: Append Encrypted Entry to Secret Journal
      operationId: appendJournalEntry
      description: 'Appends an encrypted journal entry to a secret''s journal on Polygon
        on behalf of a

        voucher user. The relayer sponsors POL gas and deducts the journal message
        fee

        from the user''s CreditLedger balance.


        The fee is calculated per 5 KB chunk:

        `chunks = ceil(len(payload) / 5120)`

        `cost = chunks * pricingRegistry.journalMessagePriceUsd()` (default 1 Credit
        per chunk).


        EIP-712 signature verification recovers the signer address, which must match
        the

        secret owner on SecretVaultSapphireGateway. The secret must be active (not
        canceled),

        mutable (not frozen), not a flash secret, and not expired (block.timestamp
        < unlockTime).


        ## Effective size limit


        The server enforces a 128 KiB cap on the entire request body of this endpoint
        (checked

        before validation) and returns HTTP 413 when it is exceeded. Because the fee
        is computed

        per 5 KB chunk of `payload`, payloads that would push the body past the cap
        are rejected

        with 413 rather than priced.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherAppendJournalRequest'
            example:
              secret_id: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
              entry_index: 1
              payload: '0x0123456789abcdef'
              deadline: 1735690200
              signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
              network: polygonAmoy
      responses:
        '200':
          description: Journal entry appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalAppendResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  entry_index: 1
                  chunks: 1
                  cost_credits: '1000000'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '409':
          description: "Journal append conflict (audit G1, 2026-10-17): the server-side\n\
            reservation for the (secret_id, entry_index) slot was already\nclaimed.\
            \ Error code is REPLAY_ATTEMPT. Details keys:\n`reason` (`in_flight` \u2014\
            \ a pending append holds the slot, retry\nafter it expires or the signed\
            \ deadline passes; or\n`index_consumed` \u2014 the index was consumed\
            \ by a different signed\npayload, refetch the journal and sign the next\
            \ index). A client\nretry with the identical signed payload after a successful\n\
            append instead receives 200 with the original tx hash\n(idempotent).\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/voucher/check:
    get:
      tags:
      - Vouchers
      summary: Check Voucher Code (Pre-Validation)
      operationId: checkVoucher
      description: 'Pre-validates a voucher code before redemption. Performs a read-only

        `checkVoucher()` call on the VoucherRegistry contract to verify the code

        is valid, unused, and not expired.


        This endpoint is intended for client-side validation before the user

        initiates the actual redemption flow. It allows the app to display

        voucher information (amount, expiry) and appropriate error messages

        without burning the code or requiring blockchain RPC knowledge.


        **Rate limit:** 10 checks per minute per IP address to prevent enumeration.


        **Response fields:**

        - `valid`: true if code exists, unused, and not expired

        - `amount_usdc`: voucher amount in USDC (6 decimals), only if valid

        - `expiry_timestamp`: Unix timestamp when voucher expires, only if valid

        - `already_redeemed`: true if code was already redeemed

        - `expired`: true if current time > expiry_timestamp

        '
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]{5,30}$
        description: Voucher code (e.g., "CLX-0D8B-BF72-45D8-4A8B")
        example: CLX-0D8B-BF72-45D8-4A8B
      - name: network
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PolygonNetworkEnum'
        description: Network to check voucher on
        example: polygonAmoy
      responses:
        '200':
          description: Voucher check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherCheckResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  valid: true
                  amount_usdc: '10000000'
                  expiry_timestamp: 1735689600
                  already_redeemed: false
                  expired: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/voucher/credit-balance:
    get:
      tags:
      - Vouchers
      summary: Get voucher credit balance
      operationId: getVoucherCreditBalance
      description: 'Returns the current credit balance for a wallet from the CreditLedger
        contract,

        along with the required amount for a specific operation.


        Use this endpoint to:

        - Display persistent balance widget in UI

        - Pre-flight check before creating/updating/cancelling secrets

        - Show "insufficient credit" warnings before operations


        The endpoint queries the CreditLedger contract for the current balance and

        the PricingRegistry contract for the required amount based on operation type

        and number of heirs.


        ## Parameters


        - `userWallet`: The wallet address to check balance for (required)

        - `network`: Polygon network (polygonAmoy or polygon) (required)

        - `operation`: Operation type (create, update, cancel) (optional, default:
        create)

        - `numHeirs`: Number of heirs for pricing calculation (optional, default:
        1)


        ## Response


        - `balance`: Current credit balance in USDC (6 decimals)

        - `required`: Required amount for the operation in USDC (6 decimals)

        - `sufficient`: Whether balance is sufficient for the operation

        - `has_voucher_system`: Whether the network has a deployed voucher system


        If the network doesn''t support the voucher system, the endpoint still returns
        HTTP 200

        with `balance: "0"`, `required: "0"`, `sufficient: false`, and `has_voucher_system:
        false`.

        '
      parameters:
      - name: userWallet
        in: query
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: User's wallet address
        example: '0x1234567890123456789012345678901234567890'
      - name: network
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PolygonNetworkEnum'
        description: Network to check balance on
        example: polygonAmoy
      - name: operation
        in: query
        required: false
        schema:
          type: string
          enum:
          - create
          - update
          - cancel
          - journal
          default: create
        description: Operation type for required balance calculation
      - name: numHeirs
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        description: Number of heirs for pricing calculation
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherCreditBalanceResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  user_wallet: '0x1234567890123456789012345678901234567890'
                  network: polygonAmoy
                  balance: '15000000'
                  required: '5000000'
                  sufficient: true
                  has_voucher_system: true
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/pricing:
    get:
      tags:
      - Pricing
      summary: Get system operation pricing
      operationId: getPricing
      description: "Returns the current operation prices (USD-denominated, 6-decimal\
        \ raw\nintegers) from the PricingRegistry contract on the requested Polygon\
        \ network,\nincluding the Flash Secret price.\n\nFlash Secrets are **NOT**\
        \ priced via `calculatePrice()` (which reverts on\n`\"flash\"`); their price\
        \ is read from `getFlashConfig()`. This endpoint exposes\nall prices in a\
        \ single call so clients can display them without each calling\nthe contract\
        \ directly.\n\n## Parameters\n\n- `network`: Polygon network (polygonAmoy\
        \ or polygon) (required)\n\n## Response (`data`)\n\n- `network`: Network identifier\n\
        - `prices`: Object of operation prices in USDC (6 decimals, raw integer strings)\n\
        \  - `create`: base create price for 1 heir\n  - `create_per_additional_heir`:\
        \ price added per additional heir\n  - `update`: update/extend price\n  -\
        \ `cancel`: cancel price\n  - `timestamp`: notary timestamp price\n  - `flash`:\
        \ flash secret price\n  - `journal`: journal message price per 5KB chunk\n\
        - `flash_max_duration_seconds`: Maximum flash secret lifetime (seconds)\n\n\
        If the network has no PricingRegistry deployed, the endpoint still returns\
        \ HTTP 200\nwith an empty `prices` object and `flash_max_duration_seconds:\
        \ 0` (no `cache` fields).\n"
      parameters:
      - name: network
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PolygonNetworkEnum'
        description: Network to read pricing from
        example: polygonAmoy
      responses:
        '200':
          description: Pricing retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  network: polygonAmoy
                  prices:
                    create: '10000000'
                    create_per_additional_heir: '2000000'
                    update: '2000000'
                    cancel: '2000000'
                    timestamp: '1000000'
                    flash: '1000000'
                    journal: '1000000'
                  flash_max_duration_seconds: 604800
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/vouchers:
    get:
      tags:
      - Vouchers
      summary: List Stored Vouchers
      operationId: listVouchers
      description: "Returns voucher records stored in this relayer's local database.\
        \ The relayer\nrecords a voucher entry whenever it processes a `VoucherRedeemed`\
        \ event from Polygon or\nreceives a voucher via P2P sync from a peer relayer.\n\
        \nOnly the `keccak256` hash of each voucher code is ever stored \u2014 the\
        \ plaintext code is\nnever logged or persisted after delivery. This ensures\
        \ that even if the relayer's database\nis compromised, actual voucher codes\
        \ cannot be extracted and reused.\n\n**Discovery sources:** `redemption` (relayer\
        \ processed it directly), `peer_sync`\n(received from a peer via `/api/vouchers/sync`),\
        \ `api_discovery` (reported by a client\nvia `/api/vouchers/discover`).\n\n\
        **Status lifecycle:** `discovered` \u2192 `redeemed`. Once a voucher is marked\
        \ `redeemed`,\nthat status cannot be reversed \u2014 conflict resolution in\
        \ P2P sync always preserves the\n`redeemed` state over `discovered`.\n"
      parameters:
      - name: network
        in: query
        description: Filter vouchers by Polygon network
        schema:
          $ref: '#/components/schemas/PolygonNetworkEnum'
      - name: status
        in: query
        description: Filter vouchers by lifecycle status
        schema:
          type: string
          enum:
          - discovered
          - redeemed
          - invalid
          - expired
          - reimbursed
      - name: discovered_by
        in: query
        schema:
          type: string
        description: Filter by relayer address that discovered the voucher
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Voucher list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VouchersListResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                - id: 1
                  code_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  network: polygonAmoy
                  status: discovered
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/vouchers/discover:
    post:
      tags:
      - Vouchers
      summary: Report Voucher Discovery
      operationId: discoverVoucher
      description: "Allows a client to inform the relayer that it has encountered\
        \ a voucher code hash \u2014\ntypically before the code has been redeemed.\
        \ The relayer stores the hash with status\n`discovered` and propagates it\
        \ to peers via `/api/vouchers/sync`. This gives the relayer\nnetwork early\
        \ visibility of voucher distribution so redemption events can be correlated\n\
        to their original batch.\n\nOnly the `keccak256(code)` hash is submitted \u2014\
        \ the plaintext code is never sent. If the\nhash already exists in the database,\
        \ the response status is `already_exists` and no\nduplicate record is created.\n\
        \nThis endpoint is intended for use by the Secret Maker app or reseller tooling.\
        \ It is\nnot required for normal voucher redemption \u2014 the `/api/voucher/redeem`\
        \ endpoint records\nthe voucher automatically upon successful redemption.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherDiscoverRequest'
            example:
              code_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
              network: polygonAmoy
      responses:
        '200':
          description: Discovery recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the voucher discovery request succeeded
                  data:
                    type: object
                    description: Voucher discovery outcome payload
                    properties:
                      code_hash:
                        type: string
                        description: Keccak256 hash of the discovered voucher code
                      status:
                        type: string
                        enum:
                        - recorded
                        - already_exists
                        description: Whether the voucher hash was newly recorded or
                          already existed
                  timestamp:
                    type: integer
                    description: Unix timestamp of the response
              example:
                success: true
                timestamp: 1709817600
                data:
                  code_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  status: recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/notary/timestamp:
    post:
      summary: Anchor a document hash to the blockchain via Voucher credit
      description: 'Allows a voucher user to publicly timestamp a document hash on
        Polygon.

        The relayer acts as the gas sponsor. The fee is deducted from the user''s
        CreditLedger.

        '
      tags:
      - Notary
      operationId: RegisterTimeStamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherTimestampRequest'
            example:
              user_wallet: '0x1234567890123456789012345678901234567890'
              doc_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
              author_name: Alice
              signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
              nonce: '1'
              deadline: '1735690200'
      responses:
        '200':
          description: Successfully anchored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxHashResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/notary/timestamp/{doc_hash}:
    get:
      summary: Get details of a single notary timestamp record by SHA3-512 hash
      description: 'Returns details of a single anchored document timestamp record
        from the relayer''s database.

        Accepts the original 64-byte (128 hex characters) SHA3-512 document hash,
        computes its Keccak256

        on the backend, and queries the local database.

        '
      tags:
      - Notary
      operationId: getNotaryTimestamp
      parameters:
      - name: doc_hash
        in: path
        required: true
        schema:
          type: string
          pattern: ^(0x)?[a-fA-F0-9]{128}$
        description: The original 64-byte SHA3-512 document hash
      responses:
        '200':
          description: Notary timestamp record details
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NotaryTimestampRecord'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  doc_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                  author: '0x1234567890123456789012345678901234567890'
                  chain: polygonAmoy
                  author_name: Alice
                  tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  block_number: 12345678
                  block_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                  block_timestamp: 1709817600
                  amount_usdc: '2500000'
                  discovered_at: '2026-04-07T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Notary timestamp record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/notary/timestamps:
    get:
      summary: List timestamp notary records
      description: 'Returns a paginated list of anchored document timestamp records
        from the relayer''s

        local database. Each record represents a document hash that was publicly

        timestamped on Polygon via the ChronoloxNotary contract.


        Supports optional filtering by `user_wallet` and `network`. Results are ordered

        by `block_number` descending (most recent first).

        '
      tags:
      - Notary
      operationId: listNotaryTimestamps
      parameters:
      - name: author
        in: query
        required: false
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: Filter by wallet address of the user who authorized the timestamp
        example: '0x1234567890123456789012345678901234567890'
      - name: chain
        in: query
        required: false
        schema:
          type: string
          enum:
          - polygon
          - polygonAmoy
        description: Filter by blockchain network
        example: polygonAmoy
      - $ref: '#/components/parameters/LimitParam'
        description: Maximum number of records to return
      - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of timestamp notary records
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Paginated notary timestamp records
                      properties:
                        records:
                          type: array
                          description: Matching notary timestamp records
                          items:
                            $ref: '#/components/schemas/NotaryTimestampRecord'
                        total:
                          type: integer
                          description: Total number of matching records (for pagination)
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  records:
                  - doc_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                    author: '0x1234567890123456789012345678901234567890'
                    chain: polygonAmoy
                    author_name: Alice
                    tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                    block_number: 12345678
                    block_hash: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                    block_timestamp: 1709817600
                    amount_usdc: '2500000'
                    discovered_at: '2026-04-07T10:30:00Z'
                  total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/vouchers/batches:
    get:
      tags:
      - Vouchers
      summary: Get Voucher Batch Creator
      description: "Retrieves the creator wallet address for a voucher batch by the\
        \ `registerBatch()`\ntransaction hash on Polygon. This is used by the registry-tool\
        \ to track which wallet\n(the company operator hot-wallet or the TimelockMultisig\
        \ owner) registered each batch.\n\nBatches are registered on `VoucherRegistry.sol`\
        \ by calling `registerBatch(hashes[],\namounts[], expiry)`. Each batch pre-loads\
        \ USDC on-chain atomically \u2014 no uncollateralised\nvouchers are ever registered.\
        \ The `creator_wallet` field identifies the `msg.sender` of\nthat transaction.\n\
        \nReturns `404` if the transaction hash is not in the relayer's database (the\
        \ relayer may\nnot have scanned back far enough, or the transaction is on\
        \ a different network).\n"
      operationId: getVoucherBatchCreator
      parameters:
      - name: tx_hash
        in: query
        required: true
        description: Transaction hash of the batch registration
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      responses:
        '200':
          description: Batch creator retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    description: Voucher batch creator lookup result
                    properties:
                      tx_hash:
                        type: string
                        pattern: ^0x[a-fA-F0-9]{64}$
                        description: Transaction hash of the batch registration
                      creator_wallet:
                        type: string
                        pattern: ^0x[a-fA-F0-9]{40}$
                        description: Wallet address that called registerBatch
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  creator_wallet: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb0'
        '400':
          description: Bad request - tx_hash parameter is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: INVALID_REQUEST
                error: tx_hash is required
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.2
        '404':
          description: Batch not found - transaction hash not in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: NOT_FOUND
                error: batch not found
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.2
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/relayers:
    get:
      tags:
      - Relayers & Staking
      summary: List Known Relayers
      operationId: listRelayers
      description: "Returns all relayer instances this relayer knows about, discovered\
        \ via the on-chain\n`RelayerStakingRegistry` on Polygon. At startup, each\
        \ relayer queries\n`getOperationalRelayers()` on the registry, retrieves each\
        \ operator's `name` and\n`endpoint`, health-checks them, and stores them locally.\n\
        \nUse `healthyOnly=true` to filter out relayers that have not responded to\
        \ a health check\nwithin the last polling cycle. The `is_outdated` flag indicates\
        \ the relayer is running a\nbinary version older than the most common version\
        \ advertised by healthy peers (determined\nby the P2P auto-update quorum mechanism).\n\
        \nThis list is the authoritative source for P2P sync target selection \u2014\
        \ both event records\nand voucher records are exchanged with the healthy peers\
        \ returned here.\n"
      parameters:
      - name: healthyOnly
        in: query
        description: When true, return only peers currently marked healthy by health
          checks
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Relayer list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayersListResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                - wallet_address: '0x1234567890123456789012345678901234567890'
                  operator_name: Relayer Operator
                  endpoint: https://relayer.example.com/api
                  is_healthy: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/metrics:
    get:
      tags:
      - Status & Monitoring
      summary: Prometheus Metrics
      operationId: getMetrics
      description: 'Exposes runtime metrics in Prometheus text format for scraping
        by a Prometheus server

        or compatible tool (Grafana Agent, VictoriaMetrics, etc.). Suitable for setting
        up

        alerting rules on ROSE/POL balance thresholds, event delivery failure rates,
        and

        relayer uptime. Use `/api/metrics/summary` for the pre-aggregated JSON dashboard
        view.

        '
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
              example: '# HELP relayer_uptime_seconds Uptime of the relayer in seconds

                # TYPE relayer_uptime_seconds gauge

                relayer_uptime_seconds 3600.5

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/income/transactions:
    get:
      tags:
      - Income
      summary: Get relayer income transactions
      operationId: getIncomeTransactions
      x-operator-only: true
      description: 'Requires operator authentication (session cookie or signed operator
        headers). Not intended for public clients.


        Returns transactions signed by this relayer''s wallet on the requested chain,
        showing gas

        costs, event types, and reimbursement status. Includes summary KPIs (total
        gas cost, 5%

        reward earned, reimbursed amount, pending reimbursement) covering both chains.


        The relayer earns a 5% reward on all gas fees for transactions it signs

        (create, update, cancel, access operations) on Sapphire (ROSE) and Polygon
        (POL).

        '
      parameters:
      - name: chain
        in: query
        schema:
          type: string
          enum:
          - sapphire
          - polygon
          default: sapphire
        description: Which chain's transactions to list (sapphire = ROSE gas, polygon
          = POL gateway gas). KPIs always cover both chains.
      - name: from_date
        in: query
        schema:
          type: integer
          format: int64
          default: 0
        description: Unix timestamp start filter (inclusive, 0 = no filter)
      - name: to_date
        in: query
        schema:
          type: integer
          format: int64
          default: 0
        description: Unix timestamp end filter (inclusive, 0 = no filter)
      - name: event_type
        in: query
        schema:
          type: string
          enum:
          - created
          - accessed
          - extended
          - cancelled
          - updated
          - admin
          - reimbursement
          - journal
          - notary
        description: Filter by event type (Sapphire vault or gateway operation)
      - name: tx_status
        in: query
        schema:
          type: string
          enum:
          - success
          - failed
          - pending
        description: Filter by transaction status (empty = all). 'failed' means the
          transaction reverted on-chain.
      - name: claimable
        in: query
        schema:
          type: boolean
          default: false
        description: When true, only return transactions eligible for reimbursement
          (on-chain OpRecord exists, not yet reimbursed, status success).
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Income transactions with KPIs
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    description: Income transaction list, summary KPIs, and current
                      wallet balances
                    properties:
                      transactions:
                        type: array
                        description: Matching relayer transactions for the selected
                          chain and filters
                        items:
                          $ref: '#/components/schemas/IncomeTransaction'
                      kpis:
                        $ref: '#/components/schemas/IncomeKPIs'
                      total_count:
                        type: integer
                        description: Total matching transactions (for pagination)
                      rose_balance:
                        type: string
                        example: '250.2500'
                        description: Relayer wallet ROSE balance on Sapphire (from
                          status cache)
                      pol_balance:
                        type: string
                        example: '5.0000'
                        description: Relayer wallet POL balance on Polygon (from status
                          cache)
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  transactions:
                  - tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                    block_number: 5234567
                    secret_id: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
                    gas_used: 50000
                    gas_price: '100000000000'
                    gas_cost: '5000000000000000'
                    gas_cost_rose: '0.005'
                    tx_timestamp: 1709817600
                    tx_status: success
                    event_type: created
                    reimbursed: true
                    claimable: true
                  kpis:
                    total_transactions: 150
                    total_gas_cost_rose: '0.7500'
                    reward_earned_rose: '0.0375'
                    reimbursed_rose: '0.7500'
                    pending_reimbursement_rose: '0.0000'
                    claimable_rose: '0.7500'
                  total_count: 150
                  rose_balance: '250.2500'
                  pol_balance: '5.0000'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/income/claim-data:
    get:
      tags:
      - Income
      summary: Get claim data for wallet-signed reimbursement
      operationId: getIncomeClaimData
      x-operator-only: true
      description: 'Requires operator authentication (session cookie or signed operator
        headers). Not intended for public clients.


        Returns the range claim data, checkpoints, and contract details needed to
        build a

        claimReimbursement transaction that will be signed by the user''s wallet (MetaMask/Rabby).


        Supports both Sapphire (ROSE) and Polygon (POL) reimbursement pools.

        '
      parameters:
      - name: chain
        in: query
        description: Chain to claim reimbursement on (sapphire or polygon)
        required: false
        schema:
          type: string
          enum:
          - sapphire
          - polygon
          default: sapphire
      responses:
        '200':
          description: Claim data for wallet-signed reimbursement
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    description: Checkpoint range, calldata, and pool details for
                      submitting a reimbursement claim
                    properties:
                      chain:
                        type: string
                        description: Target chain (sapphire or polygon)
                      start_block:
                        type: integer
                        format: int64
                        description: Start block number of the unreimbursed range
                      end_block:
                        type: integer
                        format: int64
                        description: End block number of the unreimbursed range
                      start_idx:
                        type: string
                        description: Checkpoint start index (or decimal string max
                          uint256)
                      end_idx:
                        type: integer
                        format: int64
                        description: Checkpoint end index
                      claim_calldata:
                        type: string
                        description: Hex-encoded ABI calldata for claimReimbursement
                      contract_address:
                        type: string
                        description: Target contract address (SecretVaultSapphire
                          or PolygonGasReservePool)
                      chain_id:
                        type: integer
                        format: int64
                        description: Target network chain ID
                      relayer_address:
                        type: string
                        description: Relayer wallet address
                      pool_balance_wei:
                        type: string
                        description: Current gas reserve pool balance in wei
                      estimated_payout_wei:
                        type: string
                        description: Estimated payout in wei including configured
                          markup
                      pool_sufficient:
                        type: boolean
                        description: Whether the reserve pool has sufficient balance
                          to pay the claim
                      multiplier_bps:
                        type: integer
                        format: int64
                        description: Reimbursement markup in basis points (e.g. 10500
                          for +5.0%)
                      unreimbursed_count:
                        type: integer
                        description: Number of unreimbursed transactions in the claimable
                          range
                      db_pending_count:
                        type: integer
                        description: Unreimbursed succeeded transactions in the database
                          (may exceed unreimbursed_count when some fall at/below the
                          last claimed checkpoint)
                      checkpoint_count:
                        type: integer
                        description: Number of gas checkpoints registered for this
                          relayer in the reserve pool (0 = pool not yet tracking this
                          relayer)
                      pending_start_block:
                        type: integer
                        format: int64
                        description: Lowest block number across the pending unreimbursed
                          DB rows (0 when none; populated even when nothing is claim-eligible
                          so the card can show where the pending gas lives)
                      pending_end_block:
                        type: integer
                        format: int64
                        description: Highest block number across the pending unreimbursed
                          DB rows (0 when none)
                      pending_payout_wei:
                        type: string
                        description: "Markup-inclusive estimate of the pending gas\
                          \ cost in wei (sum of DB gas_cost \xD7 multiplier_bps /\
                          \ 10000); informational only \u2014 the pool pays from its\
                          \ own checkpoints"
                      currency:
                        type: string
                        description: Reimbursement currency (ROSE or POL)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/income/mark-reimbursed:
    post:
      tags:
      - Income
      summary: Mark transactions as reimbursed after wallet-signed claim
      operationId: markReimbursed
      deprecated: true
      x-moved-to: openapi.admin.yaml
      x-operator-only: true
      description: 'Requires operator authentication (session cookie or signed operator
        headers). Not intended for public clients.


        **Deprecated (operator-only):** This endpoint is operator-only, has been copied
        to

        the private admin specification (`openapi.admin.yaml`), and will be removed
        from the

        public specification once existing operator dashboard / SDK consumers migrate.


        After the user signs and submits a claimReimbursement transaction via their
        wallet,

        this endpoint marks the corresponding database records within [start_block,
        end_block]

        as reimbursed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tx_hash
              - start_block
              - end_block
              properties:
                chain:
                  type: string
                  enum:
                  - sapphire
                  - polygon
                  default: sapphire
                  description: Chain where claim was submitted
                tx_hash:
                  type: string
                  description: Hash of the confirmed claimReimbursement transaction
                start_block:
                  type: integer
                  format: int64
                  description: Start block number of claimed range
                end_block:
                  type: integer
                  format: int64
                  description: End block number of claimed range
      responses:
        '200':
          description: Transactions marked as reimbursed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    description: Result of marking claimed transactions as reimbursed
                    properties:
                      updated_count:
                        type: integer
                        description: Number of transactions marked as reimbursed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
      description: Maximum number of results to return. Use the smallest limit that
        fits your needs. The server accepts values above 500 but clamps them to 500.
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Pagination offset. Large offset values on paginated endpoints may
        be slow; use the smallest limit that fits your needs.
    WalletPathParam:
      name: wallet
      in: path
      required: true
      schema:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}$
      description: Ethereum wallet address (20 bytes, 0x-prefixed hex)
    TxHashPathParam:
      name: txHash
      in: path
      required: true
      schema:
        type: string
        pattern: ^0x[a-fA-F0-9]{64}$
      description: Transaction hash (32 bytes, 0x-prefixed hex)
  securitySchemes:
    RelayerAuth:
      type: apiKey
      in: header
      name: X-Relayer-Signature
      description: "ECDSA signature authentication for relayer-to-relayer requests.\n\
        Requires five headers: the three legacy headers below plus `X-Relayer-Nonce`\
        \ and\n`X-Relayer-Binding` (both described in the \"Bound signature\" section\
        \ below).\n- `X-Relayer-Wallet`: The relayer's wallet address (signer)\n-\
        \ `X-Relayer-Timestamp`: Unix timestamp (must be within 2 minutes)\n- `X-Relayer-Signature`:\
        \ ECDSA signature of `keccak256(timestamp|wallet)`\nOperator endpoints (income,\
        \ restart, sync management, notary reconcile) also\naccept these headers as\
        \ one authentication path; the operator dashboard\nalternatively authenticates\
        \ via its web session cookie, which is not\nexpressible as an OpenAPI scheme.\n\
        \nBound signature (REQUIRED on all `RelayerAuth` requests \u2014 legacy-only\
        \ requests are rejected):\n- `X-Relayer-Nonce`: 32-hex-char (16-byte) per-request\
        \ nonce (5-minute replay TTL)\n- `X-Relayer-Binding`: ECDSA (personal_sign)\
        \ signature over\n  `chrono-bind-v1|timestamp|wallet|method|path|rawQuery|sha256(body)|nonce`\n\
        \  (`wallet` is lowercased; `method` is uppercase; `rawQuery` is the raw query\
        \ string\n  without `?` or empty string when absent; `sha256(body)` is lowercase\
        \ hex SHA-256 of\n  the raw body bytes, `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855`\n\
        \  for an empty body).\nVerifiers fail closed (`401`) on missing, invalid,\
        \ or replayed bindings (`REPLAY_ATTEMPT`\non replayed nonces, `REPLAY_CACHE_SATURATED`\
        \ if the nonce cache is saturated).\n"
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Reserved for optional client identification (e.g., SecretMaker
        PWA, Vault SDK)

        for client identification, usage tracking, and enhanced rate limiting. NOT
        enforced

        today: no token-issuance endpoint exists and current handlers accept and ignore

        this header. Clients may send it for forward compatibility; never rely on
        it for

        authorization.

        '
  headers:
    RetryAfter:
      description: Number of seconds to wait before retrying the request (remaining
        whole seconds in the current rate-limit window, minimum 1).
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - caller is not an authorized relayer or operator
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests - rate limit exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body too large (global 4 MB cap; 128 KB on voucher and
        journal write endpoints)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientCredit:
      description: Insufficient credit balance for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsufficientCreditResponse'
          example:
            success: false
            code: INSUFFICIENT_CREDIT
            error: insufficient_credit
            timestamp: 1709817600
            signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
            publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
            version: 1.0.0
            details:
              balance: '5000000'
              required: '10000000'
  schemas:
    ApiResponse:
      type: object
      required:
      - success
      - timestamp
      - signature
      - publicKey
      - version
      properties:
        success:
          type: boolean
          description: True when the operation succeeded, false on error
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the response was generated
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: ECDSA signature of the response payload for relayer identification
            (see Authentication -> Response Signing for verification steps)
        publicKey:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Relayer's wallet address (public key) used to sign the response
            (verify against the on-chain authorized relayer registry)
        version:
          type: string
          description: Relayer version string
          example: 1.0.0
        error:
          type: string
          description: Error message if success is false
          example: Internal server error
        data:
          description: Optional response payload. Success responses shape it per their
            own schema; a few error paths carry contextual data here (for example,
            a 409 from forcing a sync includes the running sync's `started_at` and
            `duration_seconds`).
    ErrorCode:
      type: string
      description: 'Stable machine-readable error codes returned by the Relayer API.

        Clients MUST switch on `code`. Do not parse the human-readable `error` field.

        '
      enum:
      - INVALID_REQUEST
      - VALIDATION_ERROR
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      - INVALID_SIGNATURE
      - EXPIRED_SIGNATURE
      - EXPIRED_ENVELOPE
      - REPLAY_ATTEMPT
      - REPLAY_CACHE_SATURATED
      - INVALID_AUTH_VALUE
      - SECRET_NOT_FOUND
      - SECRET_LOCKED
      - SECRET_CANCELLED
      - SECRET_VIEWED
      - SECRET_WINDOW_EXPIRED
      - SECRET_FROZEN
      - ACCESS_DENIED
      - SECRET_ALREADY_EXISTS
      - INSUFFICIENT_CREDIT
      - VOUCHER_INVALID
      - VOUCHER_ALREADY_REDEEMED
      - VOUCHER_EXPIRED
      - VOUCHER_RATE_LIMITED
      - VOUCHER_SYSTEM_UNAVAILABLE
      - RELAYER_NOT_OPERATIONAL
      - STAKING_REQUIRED
      - PEER_UNAVAILABLE
      - SYNC_IN_PROGRESS
      - BOOTSTRAP_FAILED
      - EVENT_NOT_FOUND
      - SUBMISSION_NOT_FOUND
      - REPROCESS_FAILED
      - TASK_NOT_FOUND
      - MESSAGE_NOT_FOUND
      - PUBKEY_NOT_REGISTERED
      - NOTARY_RECORD_NOT_FOUND
      x-enum-descriptions:
      - Malformed request body, missing required fields, or basic schema violation
      - One or more fields failed semantic validation
      - Missing or invalid authentication credentials
      - Authenticated but not permitted to perform the action
      - Requested resource does not exist
      - Rate limit exceeded; retry later
      - Unexpected internal server error
      - Temporary unavailability (RPC, TEE, peer, database, etc.)
      - ECDSA signature is invalid or cannot be recovered
      - Signature timestamp is outside the allowed window
      - Access envelope timestamp is older than the allowed freshness window
      - Replay of a previously used access envelope or signature
      - Replay cache has reached its capacity limit (too many pending nonces)
      - Malformed or undecryptable Encrypted Access Envelope
      - Secret ID does not exist on Sapphire or in the relayer database
      - Secret is still time-locked
      - Secret has been cancelled by the owner
      - Secret has already been viewed by a recipient
      - Access window has expired
      - Secret is frozen and cannot be mutated or cancelled
      - Caller is not authorized to access this secret
      - Secret with this ID already exists
      - CreditLedger balance is below the required amount for the operation
      - Voucher code is unknown or malformed
      - Voucher code has already been redeemed
      - Voucher code has expired
      - Too many voucher redemption attempts
      - Voucher system contracts are not deployed on the requested network
      - Relayer is not in OPERATIONAL staking state
      - Operation requires a staked operational relayer
      - No healthy peer relayers available
      - A sync or resync operation is already in progress
      - Database bootstrap / snapshot operation failed
      - Gateway event record not found
      - Voucher submission / tracking record not found
      - Reprocess of the event failed
      - Resync or background task not found
      - Message record not found
      - Wallet has not registered a public key
      - Notary timestamp record not found
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      required:
      - success
      - code
      - error
      properties:
        success:
          type: boolean
          const: false
          description: Always false for error responses
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Machine-readable error code. Clients MUST switch on this field.
        error:
          type: string
          description: Human-readable message intended for logs and debugging. Do
            not parse programmatically.
        details:
          type: object
          additionalProperties: true
          description: "Optional structured context that depends on the specific code.\n\
            Examples:\n- INSUFFICIENT_CREDIT \u2192 { \"balance\": \"5000000\", \"\
            required\": \"10000000\" }\n- VALIDATION_ERROR \u2192 { \"field\": \"\
            secretId\", \"reason\": \"must be 32 bytes\" }\n- RATE_LIMITED \u2192\
            \ { \"retry_after_seconds\": 60 }\n"
    InsufficientCreditResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      properties:
        code:
          type: string
          const: INSUFFICIENT_CREDIT
          description: Machine-readable error code (always `INSUFFICIENT_CREDIT`)
        details:
          type: object
          description: Credit balance shortfall details
          required:
          - balance
          - required
          properties:
            balance:
              type: string
              description: Current CreditLedger balance in USDC (6 decimals)
            required:
              type: string
              description: Amount required for the operation in USDC (6 decimals)
    DeadLetterNoticeRequest:
      type: object
      required:
      - gateway_tx_hash
      - event_name
      - reason
      properties:
        gateway_tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Gateway transaction hash that carries the dead-lettered event
            (0x-prefixed)
        event_name:
          type: string
          maxLength: 100
          description: Raw Solidity event name (e.g. SecretCreatedFromGateway)
        secret_id:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Secret ID derived from the event (0x-prefixed, optional)
        chain_id:
          type: integer
          format: int64
          description: "Gateway chain ID (`uint64` on-chain). Carries `format: int64`\
            \ so the generated\nGo client uses `*int64` \u2014 a bare `integer` maps\
            \ to `*int`, which is 32-bit on\njs/wasm and 32-bit targets and cannot\
            \ represent a chain ID by construction.\n"
        reason:
          type: string
          maxLength: 512
          description: "Failure reason recorded by the origin relayer. Untrusted free\
            \ text from the\npeer's perspective: receivers MUST strip control characters\
            \ (CR/LF in\nparticular) before persisting, logging, or rendering it \u2014\
            \ it reaches log lines,\n`/api/events` payloads and operator alert captions.\n"
        source_relayer:
          type: string
          description: "Origin relayer wallet address. **Informational only** \u2014\
            \ receivers MUST derive the\napplying peer from the authenticated signature\
            \ headers and MUST ignore this field\nfor every authorization, deduplication,\
            \ and audit decision. It is retained purely\nas a human-readable \"who\
            \ claimed it\" hint in a notice row whose `source_relayer`\ncolumn is\
            \ overwritten with the authenticated wallet.\n"
      example:
        gateway_tx_hash: '0x1f1e922f59e9ea1439e2a95907caf0ec493cb7b1d0ad707e82d2ed33ec54271c'
        event_name: SecretCreatedFromGateway
        secret_id: '0x89cc455056508484b115a429ef44b6371679a2118625788c6eb35beef5764141'
        chain_id: 80002
        reason: duplicate argon2 hash detected (violates Sapphire dup_hash constraint)
        source_relayer: '0xA43626883E5dbd4f1cB9cDcaE3862Fb69988694e'
    DeadLetterNoticeRecord:
      type: object
      required:
      - gateway_tx_hash
      - event_name
      - reason
      - source_relayer
      - created_at
      properties:
        gateway_tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Gateway transaction hash that carries the dead-lettered event
            (0x-prefixed)
        event_name:
          type: string
          maxLength: 100
          description: Raw Solidity event name (e.g. SecretCreatedFromGateway)
        secret_id:
          type: string
          description: Secret ID derived from the event (0x-prefixed, optional)
        chain_id:
          type: integer
          format: int64
          description: Source EVM gateway chain ID
        reason:
          type: string
          maxLength: 512
          description: Failure reason recorded when the event was dead-lettered
        source_relayer:
          type: string
          description: Wallet address of the relayer authenticated as the notice sender
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the dead-letter notice was recorded
    DeadLetterNoticesResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          description: Whether the query succeeded
        error:
          type: string
          description: Error message if success is false
        data:
          type: object
          description: Dead-letter notices response payload
          required:
          - notices
          properties:
            notices:
              type: array
              description: Recorded dead-letter notices ordered newest first
              items:
                $ref: '#/components/schemas/DeadLetterNoticeRecord'
    VoucherSyncRequest:
      type: object
      required:
      - since
      properties:
        since:
          type: integer
          format: int64
          description: Unix timestamp to filter vouchers (only vouchers after this
            time are returned)
    NotaryTimestampsSyncRequest:
      type: object
      required:
      - since
      properties:
        since:
          type: integer
          description: UNIX timestamp filter
    ForceSyncRequest:
      type: object
      properties:
        force_rpc:
          type: boolean
          description: Set to true to sync from blockchain RPC instead of P2P peers
          example: false
    NetworkEnum:
      type: string
      enum:
      - polygonAmoy
      - polygon
      - bscTestnet
      - bsc
      - arbitrumSepolia
      - arbitrum
      - sapphireTestnet
      - sapphire
      description: 'Blockchain network identifier.


        **Gateway networks (EVM chains):**

        - `polygonAmoy` - Polygon Amoy testnet (Chain ID: 80002)

        - `polygon` - Polygon mainnet (Chain ID: 137)

        - `bscTestnet` - BSC testnet (Chain ID: 97)

        - `bsc` - BSC mainnet (Chain ID: 56)

        - `arbitrumSepolia` - Arbitrum Sepolia testnet (Chain ID: 421614)

        - `arbitrum` - Arbitrum mainnet (Chain ID: 42161)


        **Sapphire networks (TEE chains):**

        - `sapphireTestnet` - Sapphire testnet (Chain ID: 23295)

        - `sapphire` - Sapphire mainnet (Chain ID: 23294)

        '
    PolygonNetworkEnum:
      type: string
      enum:
      - polygonAmoy
      - polygon
      description: 'Polygon network identifier only.

        - `polygonAmoy` - Polygon Amoy testnet (Chain ID: 80002)

        - `polygon` - Polygon mainnet (Chain ID: 137)

        '
    ReprocessDetail:
      type: object
      description: Result of processing a single failed event (used in force reprocess
        response)
      required:
      - tx_hash
      - secret_id
      - success
      properties:
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Transaction hash of the Gateway event
        secret_id:
          type: string
          description: Secret ID from the event
        success:
          type: boolean
          description: Whether the event was successfully reprocessed
        reason:
          type: string
          description: Error message if processing failed, empty string if successful
    ReprocessResults:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      required:
      - total
      - succeeded
      - failed
      - details
      properties:
        total:
          type: integer
          description: Total number of failed events processed
        succeeded:
          type: integer
          description: Number of events successfully reprocessed
        failed:
          type: integer
          description: Number of events that failed to reprocess
        details:
          type: array
          description: Detailed results for each processed event
          items:
            $ref: '#/components/schemas/ReprocessDetail'
    WalletTransaction:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the transaction
          example: 1709817600
        chain:
          type: string
          description: Blockchain network identifier
          example: polygonAmoy
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Transaction hash (32 bytes, 0x-prefixed hex)
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        secret_id:
          type: string
          description: Associated secret ID (if applicable)
          example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
        amount_usdc:
          type: string
          description: USDC amount associated with the transaction (6 decimals, raw
            integer string)
          example: '10000000'
        op_type:
          type: string
          description: Event name or operation type
          example: SecretCreatedFromGateway
        explorer_url:
          type: string
          description: Block explorer URL for the transaction (may be empty if unavailable)
          example: https://amoy.polygonscan.com/tx/0x1234567890abcdef
    WalletTransactionsResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: array
            description: List of transactions associated with the wallet
            items:
              $ref: '#/components/schemas/WalletTransaction'
    StatusResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Operational status, balances, staking info, and monitored
              gateway state
            properties:
              uptime_seconds:
                type: number
                description: Process uptime in seconds
              relayer_address:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
                description: This relayer's Ethereum wallet address
              operator_name:
                type: string
                description: Registered operator display name
              endpoint:
                type: string
                description: Public base URL advertised by this relayer
              binary_hash:
                type: string
                description: SHA-256 hash of the running relayer binary
              built:
                type: string
                description: Build timestamp (ISO 8601)
                example: '2026-03-24T08:15:58Z'
              stats:
                type: object
                description: Aggregate tracked Gateway event counts
                properties:
                  total:
                    type: integer
                    description: Total tracked Gateway events
                  delivered:
                    type: integer
                    description: Events delivered to Oasis Sapphire
                  pending:
                    type: integer
                    description: Events awaiting delivery
                  failed:
                    type: integer
                    description: Events currently in failed/retry state
              gateways:
                type: array
                description: Monitored EVM Gateway chain configurations and sync progress
                items:
                  type: object
                  properties:
                    network:
                      type: string
                      description: Network identifier (e.g. polygonAmoy)
                    chain_id:
                      type: integer
                      description: EVM chain ID
                    gateway:
                      type: string
                      description: Gateway contract address
                    last_block:
                      type: integer
                      description: Last scanned block number on this gateway
                    is_active:
                      type: boolean
                      description: Whether monitoring is active for this gateway
              relayer_staking:
                type: object
                description: Staking registry contract address and network-wide staking
                  summary
                properties:
                  address:
                    type: string
                    pattern: ^0x[a-fA-F0-9]{40}$
                    description: RelayerStakingRegistry contract address
                  min_stake:
                    type: string
                    description: Minimum stake required to become operational
                    example: 300 POL
                  total_locked:
                    type: string
                    description: Total POL currently locked across relayers
                    example: 1200 POL
                  operational_count:
                    type: integer
                    description: Number of currently operational relayers
                    example: 4
                  lock_duration:
                    type: string
                    description: Unstaking lock duration
                    example: 7 days
              rose_balance:
                type: string
                example: '250.2500'
                description: ROSE balance on Sapphire
              pol_balance:
                type: string
                example: '150.5000'
                description: POL balance on Polygon
              started_at:
                type: string
                format: date-time
                description: Relayer startup timestamp
              db_stats:
                type: object
                description: Database table counts and freshness indicator (used by
                  bootstrap peer selection)
                properties:
                  events_count:
                    type: integer
                    format: int64
                    description: Total events tracked in the database
                  gateway_transactions_count:
                    type: integer
                    format: int64
                    description: Total gateway payment transactions recorded
                  sapphire_transactions_count:
                    type: integer
                    format: int64
                    description: Total Sapphire delivery transactions recorded
                  latest_record_at:
                    type: string
                    format: date-time
                    description: Timestamp of the most recent record across events,
                      gateway_transactions, and sapphire_transactions
                example:
                  events_count: 44
                  gateway_transactions_count: 31
                  sapphire_transactions_count: 6
                  latest_record_at: '2026-03-30T05:12:00Z'
              version:
                type: string
                description: Running relayer version string
                example: 1.0.0
              update_available:
                type: boolean
                description: Whether a newer relayer release is available on the update
                  feed
              latest_version:
                type: string
                description: Latest relayer version reported by the update feed
                example: 1.0.0
              update_checked_at:
                type: string
                format: date-time
                description: Timestamp of the most recent update feed check (RFC3339)
                example: '2026-03-30T05:12:00Z'
              latest_commit:
                type: string
                description: Git commit hash of the latest release on the update feed
                  (omitted when unavailable)
                example: 17c78c2f
              latest_published_at:
                type: string
                format: date-time
                description: Publication timestamp of the latest release on the update
                  feed (RFC3339, omitted when zero)
                example: '2026-03-30T05:12:00Z'
              simplex_enabled:
                type: boolean
                description: Whether the SimpleX notification channel is enabled in
                  the operator settings (omitted when settings are unavailable)
              simplex_running:
                type: boolean
                description: Whether the supervised simplex-chat notification daemon
                  is currently running. False while the channel is enabled but dark
                  (omitted when settings are unavailable)
              simplex_error:
                type: string
                description: Last simplex-chat daemon error (omitted when there is
                  none)
    ContractAddressesResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      properties:
        data:
          type: object
          description: Deployed Gateway and PricingRegistry contract addresses for
            the requested network
          required:
          - blockchain
          - chain_id
          - gateway_address
          - has_pricing_registry
          properties:
            blockchain:
              type: string
              description: Blockchain network identifier
              example: polygonAmoy
            chain_id:
              type: integer
              description: Chain ID for the blockchain
              example: 80002
            gateway_address:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
              description: Gateway contract address (discovered from Sapphire contract)
              example: '0xABCDEF0123456789ABCDEF0123456789ABCDEF01'
            pricing_registry_address:
              oneOf:
              - type: string
                pattern: ^0x[a-fA-F0-9]{40}$
                example: '0xAE7138373A1a4b58446B80218666C36483ff1Dc0'
              - type: string
                enum:
                - ''
              description: PricingRegistry contract address (empty string if not deployed)
            has_pricing_registry:
              type: boolean
              description: Whether the PricingRegistry contract is deployed on this
                network
    MetricsSummaryResponse:
      type: object
      required:
      - generated_at
      - range_label
      - kpis
      - call_volume
      - by_blockchain
      - by_peer
      properties:
        generated_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the summary was generated
        range_label:
          type: string
          description: Human-readable label for the aggregation window (e.g. Last
            24h)
          example: Last 24h
        kpis:
          type: object
          description: Aggregated key performance indicators for the selected window
          properties:
            total_calls:
              type: integer
              description: Total inbound and outbound calls in the range
            inbound_calls:
              type: integer
              description: Total inbound API/P2P calls in the range
            outbound_calls:
              type: integer
              description: Total outbound RPC/P2P calls in the range
            success_rate:
              type: number
              format: float
              description: Overall call success rate across the range (0-100 or 0-1
                depending on metric series)
            success_rate_1h:
              type: number
              format: float
              description: Call success rate over the last 1 hour
            median_latency_ms:
              type: integer
              description: Median call latency in milliseconds
            active_peers:
              type: integer
              description: Number of active peer relayers observed
            failed_calls_1h:
              type: integer
              description: Number of failed calls in the last 1 hour
        call_volume:
          type: array
          description: Time-series call volume buckets over the selected range
          items:
            type: object
            properties:
              ts:
                type: integer
                format: int64
                description: Bucket start Unix timestamp (seconds)
              inbound:
                type: number
                description: Inbound call count in this bucket
              outbound:
                type: number
                description: Outbound call count in this bucket
              failed:
                type: number
                description: Failed call count in this bucket
        by_blockchain:
          type: array
          description: Call counts and success rates broken down by blockchain network
          items:
            type: object
            properties:
              blockchain:
                type: string
                description: Blockchain network name
              calls:
                type: integer
                description: Total calls targeting this blockchain. This is the field
                  name the server emits.
              calls_count:
                type: integer
                deprecated: true
                description: Never emitted by the server; use `calls`.
              success_rate:
                type: number
                format: float
                description: Success rate for this blockchain
        by_peer:
          type: array
          description: Call counts and success rates broken down by peer relayer
          items:
            type: object
            properties:
              peer_id:
                type: string
                description: Peer identifier or wallet address
              calls_24h:
                type: integer
                description: Calls exchanged with this peer in the window
              success_rate:
                type: number
                format: float
                description: Success rate for calls with this peer
        provider_breakdown:
          type: array
          description: RPC/provider call breakdown entries (`provider`, `total_calls`,
            `successful_calls`, `avg_latency_ms`)
          items:
            type: object
        monitored_chains:
          type: array
          description: Monitored vault and gateway chain entries (`name`, `network`,
            `chain_id`, `type`, `last_block`, `is_active`, and optional `address`/`backoff`)
          items:
            type: object
    AbuseReason:
      type: string
      enum:
      - RATE_LIMIT_EXCEEDED
      - REPLAY_ATTEMPT
      - EXPIRED_ENVELOPE
      - INVALID_SECRET
      - UNKNOWN
      description: 'Reason for the abuse report.

        - `RATE_LIMIT_EXCEEDED`: Offender exceeded the request per IP rate limit.

        - `REPLAY_ATTEMPT`: Offender reused a previous access envelope signature.

        - `EXPIRED_ENVELOPE`: Offender submitted an envelope with a stale timestamp.

        - `INVALID_SECRET`: Offender attempted to access a secret that does not exist.

        - `UNKNOWN`: General unspecified abuse signal.

        '
    RecordsSyncRequest:
      type: object
      description: Payload for syncing multiple types of records via P2P.
      required:
      - signature
      - publicKey
      - timestamp
      properties:
        events:
          type: array
          description: Gateway event records advertised by the peer
          items:
            $ref: '#/components/schemas/EventRecord'
        gateway_transactions:
          type: array
          description: Gateway chain transaction records advertised by the peer
          items:
            $ref: '#/components/schemas/GatewayTransaction'
        sapphire_transactions:
          type: array
          description: Sapphire execution transaction records advertised by the peer
          items:
            $ref: '#/components/schemas/SapphireTransaction'
        scanned_blocks:
          type: array
          description: Empty scanned block markers advertised by the peer
          items:
            $ref: '#/components/schemas/ScannedBlock'
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: ECDSA signature of the payload (with an empty signature field
            during hashing).
        publicKey:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: The relayer wallet address that signed the payload.
        timestamp:
          type: integer
          format: int64
          description: UTC timestamp when the request was generated.
    AbuseReport:
      type: object
      required:
      - type
      - relayerId
      - offender
      - reason
      - timestamp
      - signature
      properties:
        type:
          type: string
          enum:
          - abuse_report
          description: Fixed gossip message type identifier (`abuse_report`)
          example: abuse_report
        relayerId:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Address of the reporting relayer.
        secretId:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: (Optional) Secret ID associated with the abuse.
        offender:
          type: string
          description: Offender's IP address or public key.
        reason:
          $ref: '#/components/schemas/AbuseReason'
        timestamp:
          type: integer
          format: int64
          description: Timestamp (UTC) when the abuse was detected.
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: ECDSA signature of the report (with empty signature field).
    AbuseReportRequest:
      $ref: '#/components/schemas/AbuseReport'
    EventRecord:
      type: object
      description: 'A single Gateway event record tracked by the relayer. Represents
        one lifecycle

        action on a secret (creation, update, cancellation, metadata store/update,
        flash

        creation, or voucher redemption) that originated on an EVM chain and must
        be (or

        has been) delivered to Oasis Sapphire.

        '
      properties:
        id:
          type: integer
          format: int64
          description: Relayer-local auto-increment ID.
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Transaction hash on the source EVM chain (Polygon, BSC, etc.).
        block_number:
          type: integer
          format: int64
          description: Block number on the source chain where the event was emitted.
        event_name:
          type: string
          example: SecretCreatedFromGateway
          description: 'Name of the Gateway Solidity event. One of: `SecretCreatedFromGateway`,

            `SecretUpdatedFromGateway`, `SecretCancelledFromGateway`, `SecretMetadataStored`,

            `SecretMetadataUpdated`, `FlashSecretCreated`, `VoucherRedeemed`.

            '
        secret_id:
          type: string
          example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
          description: On-chain secret ID (bytes32 hex, truncated to uint64 for Sapphire).
        message_hash:
          type: string
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          description: The messageHash field from the Gateway event, used for shard
            assignment (uint256(messageHash) % totalRelayers).
        chain:
          type: string
          example: polygonAmoy
          description: Human-readable network name (e.g. `polygonAmoy`).
        chain_id:
          type: integer
          format: int64
          example: 80002
          description: EVM chain ID (e.g. 80002 for Polygon Amoy).
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
          - permanently_failed
          example: delivered
          description: 'Delivery status to Oasis Sapphire. `pending` = queued for
            bridging; `delivered` =

            Sapphire transaction confirmed; `failed` = within the retry budget (will
            be retried);

            `permanently_failed` = terminal dead-letter state, all retries exhausted
            and the event

            is no longer reprocessed (revived only by an explicit operator force-reprocess).

            '
        retries:
          type: integer
          description: Number of delivery attempts made so far.
        error:
          type: string
          description: Last error message if status is `failed`. Empty string on success.
        sapphire_tx_hash:
          type: string
          description: Transaction hash on Oasis Sapphire once the event has been
            delivered. Empty until delivery succeeds.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this record was first created in the relayer
            database
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this record was last updated
        tx_from:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address that submitted the source transaction on the
            EVM chain.
        wallet_address:
          type: string
          description: User wallet address extracted from the event payload (may differ
            from `tx_from` for voucher relayed calls).
        owner:
          type: string
          example: '0x1234567890123456789012345678901234567890'
          description: Owner/creator of the secret (wallet address hex).
        recipient:
          type: string
          example: '0xabcdef0123456789abcdef0123456789abcdef01'
          description: Target recipient of the secret (if known, wallet address hex).
        amount:
          type: string
          example: '10000000'
          description: Payment amount in wei (string for large uint256).
        amount_usd:
          type: string
          example: '10.00'
          description: Estimated USD value of the payment.
        token_symbol:
          type: string
          example: USDC
          description: Token symbol used for payment (e.g. USDC, MATIC).
        unlock_time:
          type: integer
          format: int64
          example: 1735689600
          description: Unix timestamp when the secret unlocks.
        access_window_end:
          type: integer
          format: int64
          example: 1735689900
          description: Unix timestamp when the access window expires (0 = no window).
        secret_salt_s:
          type: string
          example: '0x0123456789abcdef0123456789abcdef'
          description: Storage/decryption salt (16 bytes hex).
        secret_salt_a:
          type: string
          example: '0xfedcba9876543210fedcba9876543210'
          description: Authentication/Argon2 salt (16 bytes hex).
        content_key_hash:
          type: string
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          description: Hash of the content key (32 bytes hex).
        drand_ciphertext:
          type: string
          description: Hex-encoded drand timelock ciphertext for offline fallback
            decryption. Empty for secrets requiring multi-party consensus (threshold
            > 1).
        tx_data:
          type: string
          description: Raw transaction calldata (hex string).
        total_recipients:
          type: integer
          description: Total number of authorized recipients.
        reveal_threshold:
          type: integer
          description: Number of relayers required to reveal the secret.
        auto_destroy:
          type: boolean
          description: Whether the secret is configured to delete itself from Sapphire
            storage after the first successful recipient access.
        store_approvals:
          type: boolean
          description: Whether to store secret approvals on-chain.
        is_frozen:
          type: boolean
          description: Whether the secret is frozen (cannot be updated or cancelled).
        secret_type:
          type: integer
          description: 'Type of the secret: 0 = SimpleSecret, 1 = ExternalCapsule.'
        crypto_suite:
          type: integer
          description: 'Cryptographic suite used: 0 = X25519_AES_GCM, 1 = ML_KEM_HYBRID.'
        metadata:
          type: string
          description: Optional encrypted metadata associated with the secret.
        is_flash:
          type: boolean
          description: 'True if this event was a `FlashSecretCreated` event. Flash
            secrets are limited to

            one per wallet, one recipient, a maximum 7-day unlock window, and cannot
            be updated

            or cancelled. The `isFlash` flag is permanently stored in Sapphire TEE
            state.

            '
        is_voucher:
          type: boolean
          description: 'True if the secret was created via the voucher/credit path
            (relayer called

            `relayedCreateSecret()` on behalf of a `CreditLedger` user). False for
            direct

            USDC wallet transactions.

            '
    ScannedBlock:
      type: object
      description: 'A block that has been scanned and found to contain no relevant
        events.

        This information is shared between relayers via P2P sync to avoid redundant
        RPC queries.

        '
      required:
      - chain_id
      - block_number
      - scanned_at
      - event_count
      properties:
        chain_id:
          type: integer
          format: int64
          description: Chain ID (e.g., 80002 for Polygon Amoy)
        block_number:
          type: integer
          format: int64
          description: Block number that was scanned
        scanned_at:
          type: string
          format: date-time
          description: When the block was scanned
        event_count:
          type: integer
          description: Number of events found (always 0 for scanned blocks)
    GatewayTransaction:
      type: object
      description: 'A transaction on a Gateway network (Polygon, BSC, etc.) tracked
        by the relayer.

        Includes payment details and linking information to Sapphire events.

        '
      properties:
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Gateway transaction hash (0x-prefixed)
        block_number:
          type: integer
          format: int64
          description: Block number on the gateway chain
        chain:
          type: string
          description: Gateway network name (e.g. polygonAmoy)
        chain_id:
          type: integer
          format: int64
          description: Gateway EVM chain ID
        tx_from:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Sender wallet address of the gateway transaction
        tx_to:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Destination contract address (Gateway)
        tx_value:
          type: string
          description: Native token value transferred in wei
        gas_used:
          type: integer
          format: int64
          description: Gas units consumed by the transaction
        gas_price:
          type: string
          description: Effective gas price in wei
        gas_cost:
          type: string
          description: Total gas cost in wei (gas_used * gas_price)
        tx_timestamp:
          type: integer
          format: int64
          description: Block Unix timestamp (seconds) of the transaction
        tx_status:
          type: string
          description: Transaction execution status (`success`, `failed`, or `pending`)
        usdc_amount:
          type: string
          description: USDC payment amount in base units (6 decimals)
        usdc_from:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Payer wallet address for the USDC transfer
        usdc_to:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Recipient address for the USDC transfer
        stablecoin_type:
          type: string
          description: Stablecoin token symbol/type used for payment (e.g. USDC)
        secret_salt_s:
          type: string
          description: Storage/decryption salt (hex string)
        secret_salt_a:
          type: string
          description: Authentication salt (hex string)
        store_approvals:
          type: boolean
          description: Whether to store secret approvals on-chain
        content_key_hash:
          type: string
          description: Hash of the content key (hex string)
        secret_id:
          type: string
          description: Associated secret ID (bytes32 hex)
        linked_event_tx_hash:
          type: string
          description: Linked Gateway event transaction hash
        event_name:
          type: string
          description: Decoded Solidity event name
        drand_ciphertext:
          type: string
          description: Hex-encoded drand timelock ciphertext for offline fallback
            decryption.
        function_selector:
          type: string
          description: 4-byte Solidity function selector (0x...)
        event_type:
          type: string
          description: Decoded operation type
        reimbursed:
          type: integer
          description: Whether gas reimbursement has been claimed (0 or 1)
        reimbursed_tx_hash:
          type: string
          description: Reimbursement claim transaction hash
        reimbursed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when reimbursement was marked (nullable)
    SapphireTransaction:
      type: object
      description: 'A transaction on Oasis Sapphire network tracked by the relayer.

        Includes execution details and linking information to Gateway events.

        '
      properties:
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Oasis Sapphire transaction hash (0x-prefixed)
        block_number:
          type: integer
          format: int64
          description: Block number on Oasis Sapphire
        tx_from:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Relayer wallet address that submitted the transaction
        tx_to:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Target contract address on Oasis Sapphire
        tx_value:
          type: string
          description: Native ROSE value transferred in wei
        gas_used:
          type: integer
          format: int64
          description: Gas units consumed by the transaction
        gas_price:
          type: string
          description: Effective gas price in wei
        gas_cost:
          type: string
          description: Total gas cost in wei (gas_used * gas_price)
        tx_timestamp:
          type: integer
          format: int64
          description: Block Unix timestamp (seconds) of the transaction
        tx_status:
          type: string
          description: Transaction execution status (`success`, `failed`, or `pending`)
        store_approvals:
          type: boolean
          description: Whether to store secret approvals on-chain
        function_selector:
          type: string
          description: 4-byte Solidity function selector (0x-prefixed)
        secret_id:
          type: string
          description: Associated secret ID (bytes32 hex)
        event_type:
          type: string
          description: Decoded vault operation type
        linked_gateway_tx_hash:
          type: string
          description: Originating EVM Gateway transaction hash
        reimbursed:
          type: integer
          description: Whether gas reimbursement has been claimed (0 or 1)
        reimbursed_tx_hash:
          type: string
          description: Reimbursement claim transaction hash
        reimbursed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when reimbursement was marked (nullable)
    EventsListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - events
            - scanned_blocks
            properties:
              events:
                type: array
                description: Gateway event records matching the query
                items:
                  $ref: '#/components/schemas/EventRecord'
              scanned_blocks:
                type: array
                description: Scanned blocks confirmed to contain no relevant events
                items:
                  $ref: '#/components/schemas/ScannedBlock'
              gateway_transactions:
                type: array
                description: Gateway transaction records matching the query
                items:
                  $ref: '#/components/schemas/GatewayTransaction'
              sapphire_transactions:
                type: array
                description: Sapphire transaction records matching the query
                items:
                  $ref: '#/components/schemas/SapphireTransaction'
              messages:
                type: array
                description: Wallet message records matching the query
                items:
                  $ref: '#/components/schemas/MessageRecord'
            description: 'Contains both events and scanned empty blocks. The scanned_blocks
              array

              allows relayers to skip RPC queries for blocks that have already been
              scanned

              and found to contain no relevant events.

              '
    IBLTSyncRequest:
      type: object
      description: 'Request payload for exact P2P set reconciliation using IBLT.

        '
      required:
      - from_block
      - to_block
      - iblt_data
      - timestamp
      - signature
      - publicKey
      properties:
        from_block:
          type: integer
          description: Starting block number (inclusive)
        to_block:
          type: integer
          description: Ending block number (inclusive)
        chain:
          type: string
          description: Network name filter.
        chain_id:
          type: integer
          description: Numeric chain ID.
        iblt_data:
          type: object
          description: Base64-encoded IBLT partitions.
          properties:
            events:
              type: string
              description: Base64-encoded IBLT for Gateway event keys
            gateway_transactions:
              type: string
              description: Base64-encoded IBLT for Gateway transaction keys
            sapphire_transactions:
              type: string
              description: Base64-encoded IBLT for Sapphire transaction keys
            scanned_blocks:
              type: string
              description: Base64-encoded IBLT for scanned block keys
            messages:
              type: string
              description: Base64-encoded IBLT for wallet message keys
        timestamp:
          type: integer
          format: int64
          description: UTC timestamp.
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: ECDSA signature of the IBLT sync request payload
        publicKey:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address of the requesting relayer
    IBLTSyncResponse:
      type: object
      description: Response containing records missing from peer and keys missing
        from responder.
      required:
      - missing_from_peer
      - missing_from_me
      properties:
        missing_from_peer:
          type: object
          description: Full records that the requester is missing.
          properties:
            events:
              type: array
              description: Gateway events missing from the requester
              items:
                $ref: '#/components/schemas/EventRecord'
            gateway_transactions:
              type: array
              description: Gateway transactions missing from the requester
              items:
                $ref: '#/components/schemas/GatewayTransaction'
            sapphire_transactions:
              type: array
              description: Sapphire transactions missing from the requester
              items:
                $ref: '#/components/schemas/SapphireTransaction'
            scanned_blocks:
              type: array
              description: Empty scanned blocks missing from the requester
              items:
                $ref: '#/components/schemas/ScannedBlock'
            messages:
              type: array
              description: Wallet messages missing from the requester
              items:
                $ref: '#/components/schemas/MessageRecord'
        missing_from_me:
          type: object
          description: 'Record keys that the responder is missing. The requester should

            subsequently send these records to the responder using /api/records/sync.

            '
          properties:
            events:
              type: array
              description: Gateway event keys missing from the responder
              items:
                type: string
            gateway_transactions:
              type: array
              description: Gateway transaction keys missing from the responder
              items:
                type: string
            sapphire_transactions:
              type: array
              description: Sapphire transaction keys missing from the responder
              items:
                type: string
            scanned_blocks:
              type: array
              description: Scanned block keys missing from the responder
              items:
                type: string
            messages:
              type: array
              description: Wallet message keys missing from the responder
              items:
                type: string
        decoding_success:
          type: boolean
          description: 'Whether the IBLT was successfully decoded. If false, the set
            difference

            exceeded the IBLT capacity, and the caller should retry with a smaller
            range.

            '
    EventDetailResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Transaction hash and associated Gateway event records
            properties:
              tx_hash:
                type: string
                description: Queried Gateway transaction hash
              events:
                type: array
                description: Event records emitted in this transaction
                items:
                  $ref: '#/components/schemas/EventRecord'
    ReprocessResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      properties:
        data:
          type: object
          description: Acknowledgement of event reprocessing initiation
          properties:
            tx_hash:
              type: string
              description: Transaction hash queued for reprocessing
            status:
              type: string
              const: reprocessing
              description: Always `reprocessing`
    ReprocessGatewayRequest:
      type: object
      required:
      - txHash
      properties:
        secretId:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Optional hex-encoded 32-byte secret ID (auto-discovered from
            event logs if omitted)
        txHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Hex-encoded 32-byte gateway transaction hash
    ReprocessGatewayResult:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Result of direct-mode gateway transaction reprocessing
            required:
            - success
            - status
            properties:
              success:
                type: boolean
                description: Whether the transaction was successfully processed/already
                  delivered
              status:
                type: string
                enum:
                - completed
                - skipped
                - failed
                description: Outcome status of the request
              sapphire_tx_hash:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: The Sapphire transaction hash if created/existing, or
                  empty
              message:
                type: string
                description: Detailed outcome message
    TxHashResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Transaction submission payload
            properties:
              tx_hash:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: Submitted blockchain transaction hash (32 bytes, 0x-prefixed
                  hex)
    AccessSecretRequest:
      type: object
      required:
      - secretId
      - authValue
      properties:
        secretId:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: 'The on-chain secret ID (bytes32 hex) returned when the secret
            was created.

            The creator shares this with the recipient along with the access password.

            '
        authValue:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
          description: "The Encrypted Access Envelope (auth value) constructed client-side.\
            \ Contains the recipient's\nArgon2id password hash, the current timestamp\
            \ (must be within 8 minutes), and\nthis relayer's wallet address \u2014\
            \ all encrypted with the Sapphire contract's X25519\npublic key. The TEE\
            \ decrypts the envelope and rejects any request where the\nrelayer binding\
            \ does not match `msg.sender`, preventing a malicious relayer from\nforwarding\
            \ envelopes intended for a different relayer.\n"
    AccessSecretData:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Decrypted secret payload and recipient key-derivation material
            properties:
              content:
                type: string
                description: Hex-encoded decrypted secret content (layer 1)
              share:
                type: string
                description: Hex-encoded encrypted Shamir share for this recipient
                  (empty if not multi-recipient)
              salt_s:
                type: string
                pattern: ^0x[a-fA-F0-9]{32}$
                description: 16-byte hex salt for Argon2 key derivation (salt_S)
    VoucherRedeemRequest:
      type: object
      required:
      - encryptedPayload
      - wallet
      - network
      properties:
        encryptedPayload:
          type: string
          description: 'Hex-encoded X25519+Deoxys-II encryption envelope produced
            by `EncryptForSapphire(plaintextCode, sapphireX25519PublicKey)`. The relayer
            decrypts this inside the Sapphire TEE; the plaintext code is never visible
            to the relayer.

            '
          pattern: ^0x[a-fA-F0-9]{100,}$
          example: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        wallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Recipient wallet address to credit on CreditLedger
        network:
          $ref: '#/components/schemas/PolygonNetworkEnum'
    VoucherRedeemResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Voucher redemption result
            properties:
              tx_hash:
                type: string
                description: Polygon VoucherRegistry.redeem transaction hash
              usdc_credited:
                type: string
                description: USDC amount credited to the wallet (6 decimals, raw integer
                  string)
    VoucherCheckResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Voucher validity, value, and expiration details
            properties:
              valid:
                type: boolean
                description: true if code exists, unused, and not expired
              amount_usdc:
                type: string
                pattern: ^[0-9]+$
                description: "Voucher amount in USDC (6 decimals). \nPopulated only\
                  \ when the voucher code is valid.\n"
              expiry_timestamp:
                type: integer
                format: int64
                description: 'Unix timestamp when voucher expires.

                  Populated only when the voucher code is valid.

                  '
              already_redeemed:
                type: boolean
                description: "true if the code was already redeemed. Null when valid=true\
                  \ (already known to be unused).\n**Note**: Current contract `checkVoucher()`\
                  \ cannot distinguish \"unknown code\" from \"already redeemed\"\
                  \ \u2014\nboth return `(false, 0, 0)`. This field will be populated\
                  \ as `false` when valid=true, but may be `null`\nwhen valid=false\
                  \ until a `getVoucherStatus()` function is added to the VoucherRegistry\
                  \ contract.\n"
              expired:
                type: boolean
                description: 'true if current time > expiry_timestamp. Null when valid=true
                  (not expired).

                  This is computed client-side from `expiry_timestamp` when valid=false.

                  '
    VouchersListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: array
            description: List of stored voucher records
            items:
              $ref: '#/components/schemas/Voucher'
    Voucher:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Relayer-local voucher record ID
          example: 42
        code_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Keccak256 hash of the voucher code (plaintext is never stored)
          example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
        network:
          type: string
          description: Polygon network identifier
          example: polygonAmoy
        status:
          type: string
          description: Voucher lifecycle status (`discovered`, `redeemed`, `invalid`,
            `expired`, `reimbursed`)
          example: redeemed
        redeemer_wallet:
          type: string
          description: Wallet address that redeemed the voucher (if redeemed)
          example: '0x1234567890123456789012345678901234567890'
        redemption_tx_hash:
          type: string
          description: Transaction hash of the redemption on Polygon (if redeemed)
          example: '0x9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba'
        usdc_amount_wei:
          type: string
          description: Voucher value in USDC base units (6 decimals)
          example: '10000000'
        discovered_at:
          type: string
          format: date-time
          description: Timestamp when this voucher was first discovered
          example: '2026-05-01T12:00:00Z'
        redeemed_at:
          type: string
          format: date-time
          description: Timestamp when this voucher was redeemed
          example: '2026-05-01T12:05:00Z'
        discovered_by:
          type: string
          description: Relayer address that first discovered this voucher
          example: '0x1234567890123456789012345678901234567890'
        discovery_source:
          type: string
          description: How the voucher was discovered (`redemption`, `peer_sync`,
            `api_discovery`, or `polygon_scan`)
          example: polygon_scan
        voucher_type:
          type: string
          description: Optional voucher category or campaign type (e.g. `standard`)
          example: standard
        metadata:
          type: string
          description: Optional JSON metadata string associated with the voucher
          example: '{"campaign":"spring2026"}'
    VoucherDiscoverRequest:
      type: object
      required:
      - code_hash
      - network
      properties:
        code_hash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Keccak256 hash of the voucher code (32 bytes, 0x-prefixed hex)
        network:
          type: string
          description: Target Polygon network identifier (`polygon` or `polygonAmoy`)
        type:
          type: string
          maxLength: 32
          description: Optional voucher type label (max 32 characters)
    VoucherTimestampRequest:
      type: object
      required:
      - user_wallet
      - doc_hash
      - signature
      - nonce
      - deadline
      properties:
        user_wallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: App-generated wallet address of the voucher user
        doc_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Bytes32 quantum-resistant hash of the encrypted .clox archive
        author_name:
          type: string
          maxLength: 100
          description: Optional unencrypted plain-text author name or pseudonym
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
          description: EIP-712 signature authorizing the timestamp fee deduction
        nonce:
          type: string
          description: 'Replay protection nonce (uint256, encoded as decimal string
            for precision).

            Note: VoucherCreateSecretRequest, VoucherUpdateSecretRequest, and

            VoucherCancelSecretRequest use `integer` (`int64`) for `nonce` instead
            of `string`.

            '
        deadline:
          type: string
          description: 'Replay-protection expiration Unix timestamp for the signature
            (uint256, encoded as

            decimal string for precision). Note: VoucherCreateSecretRequest, VoucherUpdateSecretRequest,

            VoucherCancelSecretRequest, and VoucherAppendJournalRequest use `integer`
            (`int64`) for

            `deadline` instead of `string`.

            '
    NotaryTimestampRecord:
      type: object
      required:
      - doc_hash
      - author
      - tx_hash
      - block_number
      - block_hash
      - block_timestamp
      - chain
      properties:
        doc_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{128}$
          description: SHA3-512 hash of the anchored document (0x-prefixed, 128 hex
            characters)
        author:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address of the author who anchored the document
        author_name:
          type: string
          description: Optional author display name or pseudonym
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Polygon transaction hash that anchored the timestamp
        block_number:
          type: integer
          description: Block number on Polygon where the timestamp was anchored
        block_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Block hash containing the anchoring transaction
        block_timestamp:
          type: integer
          description: Block Unix timestamp (seconds) when the document was anchored
        chain:
          type: string
          description: Polygon network identifier (e.g. polygonAmoy, polygon)
        amount_usdc:
          type: string
          description: Fee deducted in USDC base units (6 decimals)
        discovered_at:
          type: string
          description: Timestamp when the relayer recorded this notary entry
    VoucherCreateSecretRequest:
      type: object
      required:
      - userWallet
      - signature
      - nonce
      - deadline
      - numHeirs
      - unlockTime
      - accessWindowEnd
      - autoDestroy
      - encryptedContent
      - argon2Hashes
      - saltS
      - saltA
      - revealThreshold
      - encryptedMetadata
      - secretType
      - isFrozen
      - isFlash
      - storeApprovals
      - encryptedContentKeys
      - contentKeyHash
      properties:
        userWallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address of the voucher user
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: 'EIP-712 typed data signature produced by the userWallet. The
            signed message

            includes (userWallet, keccak256(encryptedContent), numHeirs, nonce, deadline).

            Verified off-chain by the Relayer and on-chain by the Gateway.

            '
        nonce:
          type: integer
          format: int64
          description: 'User nonce for replay protection. Fetched from the Voucher
            contract via

            userNonces(userWallet). Must match the current on-chain nonce.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        deadline:
          type: integer
          format: int64
          description: 'Replay-protection Unix timestamp after which the signature
            is no longer valid (expires).

            Must be at least current time. Gateway and Relayer both reject expired
            signatures.

            Recommended value: current time + 5 minutes.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        numHeirs:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of heirs/recipients
        unlockTime:
          type: integer
          format: int64
          description: Unix timestamp when the secret unlocks
        accessWindowEnd:
          type: integer
          format: int64
          default: 0
          description: Unix timestamp when access window ends
        autoDestroy:
          type: boolean
          default: true
          description: Whether to auto-destroy after access window
        encryptedContent:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          minLength: 1
          maxLength: 204800
          description: Hex-encoded encrypted secret content
        argon2Hashes:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{64}$
          description: Argon2 hashes for each heir
        saltS:
          type: string
          pattern: ^0x[a-fA-F0-9]{32}$
          description: Single secret-level salt (16 bytes hex). To derived content_key.
        saltA:
          type: string
          pattern: ^0x[a-fA-F0-9]{32}$
          description: Auth salt (16 bytes hex). Used for deriving authentication
            hashes.
        revealThreshold:
          type: integer
          minimum: 1
          description: Number of heirs required to reveal the secret
        encryptedMetadata:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          maxLength: 4096
          description: Optional hex-encoded encrypted metadata
        secretType:
          type: integer
          enum:
          - 0
          - 1
          default: 0
          description: 'Secret type: 0 = SimpleSecret (default), 1 = ExternalCapsule.

            SimpleSecret stores content directly on-chain. ExternalCapsule stores
            only

            the decryption key; content is in physically distributed encrypted files.

            '
        isFrozen:
          type: boolean
          default: false
          description: "If true, creates a frozen commitment that cannot be updated\
            \ or cancelled.\nFrozen secrets have permanent immutability \u2014 use\
            \ with caution.\n"
        isFlash:
          type: boolean
          default: false
          description: 'True if this is a flash secret (short-lived, N=1, no mutation).
            Flash

            secrets are limited to one per wallet, single recipient only, maximum

            7-day unlock window, and cannot be updated or cancelled.

            '
        storeApprovals:
          type: boolean
          default: true
          description: "When true every heir approval is\nstored in TEE state even\
            \ before the threshold is reached.\nOnce the threshold is met, ALL recipients\
            \ can retrieve the secret in a subsequent call.\nWhen false: standard\
            \ flow \u2014\nonly the caller that tips the threshold receives content\
            \ immediately.\n"
        encryptedContentKeys:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]*$
          description: Hex-encoded encrypted content keys for each heir
        contentKeyHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Hash of the content key.
        drandCiphertext:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: Optional hex-encoded drand fallback ciphertext
    VoucherUpdateSecretRequest:
      type: object
      required:
      - userWallet
      - signature
      - nonce
      - deadline
      - network
      - secretId
      properties:
        userWallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address of the voucher user
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: 'EIP-712 typed data signature produced by the userWallet. The
            signed message

            includes (userWallet, secretId, keccak256(newEncryptedContent) or 0, nonce,
            deadline).

            Verified off-chain by the Relayer and on-chain by the Gateway.

            '
        nonce:
          type: integer
          format: int64
          description: 'User nonce for replay protection. Fetched from the Voucher
            contract via

            userNonces(userWallet). Must match the current on-chain nonce.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        deadline:
          type: integer
          format: int64
          description: 'Replay-protection Unix timestamp after which the signature
            expires. Must be >= current time.

            Recommended value: current time + 5 minutes.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        network:
          type: string
          description: Network name (e.g. polygonAmoy, polygonMainnet)
        secretId:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: The secret ID to update
        newEncryptedContent:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          maxLength: 204800
          description: 'New hex-encoded encrypted secret content. Pass `0x` (empty
            bytes) to leave unchanged.

            At least one of `newEncryptedContent`, `newUnlockTime`, or `newAccessWindowEnd`
            must be non-zero/non-empty.

            '
        newUnlockTime:
          type: integer
          format: int64
          description: 'New Unix timestamp when the secret unlocks. Must be strictly
            greater than the

            current stored value (forward-only). Pass 0 or omit to leave unchanged.

            '
        newAccessWindowEnd:
          type: integer
          format: int64
          description: 'New Unix timestamp when the access window ends. Must be strictly
            greater than

            the current value and strictly after the (possibly updated) newUnlockTime.

            Cannot be added post-creation if not set originally. Pass 0 or omit to
            leave

            unchanged.

            '
    VoucherCancelSecretRequest:
      type: object
      required:
      - userWallet
      - signature
      - nonce
      - deadline
      - network
      - secretId
      properties:
        userWallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Wallet address of the voucher user
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: 'EIP-712 typed data signature produced by the userWallet. The
            signed message

            includes (userWallet, secretId, nonce, deadline).

            Verified off-chain by the Relayer and on-chain by the Gateway.

            '
        nonce:
          type: integer
          format: int64
          description: 'User nonce for replay protection. Fetched from the Voucher
            contract via

            userNonces(userWallet). Must match the current on-chain nonce.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        deadline:
          type: integer
          format: int64
          description: 'Replay-protection Unix timestamp after which the signature
            expires. Must be >= current time.

            Recommended value: current time + 5 minutes.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        network:
          type: string
          description: Network name (e.g. polygonAmoy, polygonMainnet)
        secretId:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: The secret ID to cancel
    VoucherAppendJournalRequest:
      type: object
      required:
      - secret_id
      - entry_index
      - payload
      - deadline
      - signature
      properties:
        secret_id:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: The 32-byte secret ID
        entry_index:
          type: integer
          minimum: 1
          description: Expected entry index, 1-based (must equal current journal length
            + 1)
        payload:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
          description: Hex-encoded encrypted journal entry payload (max 25,600 bytes
            = 5 chunks)
        deadline:
          type: integer
          format: int64
          description: 'Replay-protection Unix timestamp deadline for EIP-712 signature
            validity.

            Note: encoded here as `integer` (`int64`), whereas VoucherTimestampRequest
            uses `string`.

            '
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: 65-byte EIP-712 signature hex
        network:
          type: string
          description: Optional network name (e.g. polygonAmoy, polygon)
    JournalAppendResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Journal entry append confirmation and billing details
            required:
            - tx_hash
            - entry_index
            - chunks
            - cost_credits
            properties:
              tx_hash:
                type: string
                description: Polygon transaction hash
              entry_index:
                type: integer
                description: Appended entry index
              chunks:
                type: integer
                description: Number of 5KB chunks billed
              cost_credits:
                type: string
                description: Cost in Credits (6 decimals, e.g. "1000000" for 1 Credit)
    VoucherSecretResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Relayed voucher secret operation submission and transaction
              details
            properties:
              submissionId:
                type: string
                description: Unique submission identifier
              secretId:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: The secret ID
              status:
                type: string
                enum:
                - relayed
                - updated
                - cancelled
                description: Operation status
              polygonTxHash:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: Polygon transaction hash
              sapphireTxHash:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: Optional Sapphire transaction hash (for update/cancel)
    SapphirePublicKeysResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Sapphire TEE encryption public keys and fetch timestamp
            required:
            - x25519_key
            - fetched_at
            properties:
              x25519_key:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
                description: X25519 public key (32 bytes as hex)
              kyber_key:
                oneOf:
                - type: string
                  pattern: ^0x[a-fA-F0-9]+$
                  description: ML-KEM-1024 public key
                - type: string
                  enum:
                  - ''
                  description: Empty string if not supported
                description: ML-KEM-1024 public key (variable length, may be empty)
              fetched_at:
                type: integer
                format: int64
                description: Unix timestamp when keys were fetched from the Sapphire
                  contract
    SecretStatusResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Secret existence and lifecycle status on Oasis Sapphire
            required:
            - exists
            - status
            properties:
              exists:
                type: boolean
                description: Whether a secret with this ID exists on Sapphire
              status:
                type: integer
                minimum: 0
                maximum: 4
                description: 'Secret lifecycle status enum:

                  - 0 = Locked (initial state after creation)

                  - 1 = Unlocked (unlock time reached)

                  - 2 = Cancelled (cancelled by owner)

                  - 3 = Viewed (accessed by recipient)

                  - 4 = WindowExpired (access window closed)

                  '
    SecretOwnerListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Secret IDs owned by the queried wallet address
            required:
            - secret_ids
            properties:
              secret_ids:
                type: array
                items:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{64}$
                description: Array of secret IDs (bytes32) owned by the address
                example:
                - '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                - '0xfedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
    SecretInfoData:
      description: 'Business payload carried in the `data` field of the standard signed
        response

        envelope (the envelope itself is defined by the operation''s `allOf` with

        `ApiResponse`).

        '
      type: object
      required:
      - secret_id
      - event_name
      - unlock_time
      - secret_salt_s
      - status
      properties:
        secret_id:
          type: string
          description: The secret ID (hex string)
        event_name:
          type: string
          description: The event name (e.g., SecretCreatedFromGateway)
        unlock_time:
          type: integer
          format: int64
          description: Unix timestamp when the secret unlocks
        access_window_end:
          type: integer
          format: int64
          description: Unix timestamp for access window end (0 = no window)
        secret_salt_s:
          type: string
          pattern: ^0x[a-fA-F0-9]{32}$|^$
          description: 16-byte hex string for deriving recipient salts (empty if not
            available)
        secret_salt_a:
          type: string
          pattern: ^0x[a-fA-F0-9]{32}$|^$
          description: 16-byte hex string for auth/argon2 verification salt (empty
            if not available)
        content_key_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$|^$
          description: 32-byte hex string for content key hash (empty if not available)
        status:
          type: string
          description: Processing status (pending, delivered, failed, etc.)
        error:
          type: string
          description: Error message if the status is failed or skipped
        chain:
          type: string
          description: Source chain where the event was recorded
        block_number:
          type: integer
          description: Block number of the event
        owner:
          type: string
          description: Owner address who created the secret
        recipient:
          type: string
          description: Recipient address who can access the secret
        auto_destroy:
          type: boolean
          description: True if the secret is destroyed after access
        store_approvals:
          type: boolean
          description: Whether to store secret approvals on-chain
        metadata:
          type: string
          description: Hex-encoded raw transaction data (contains encrypted content)
        total_recipients:
          type: integer
          description: Total number of recipients
        reveal_threshold:
          type: integer
          description: Threshold for revealing multi-recipient secret
        is_frozen:
          type: boolean
          description: Whether the secret is frozen (cannot be updated or cancelled)
        is_flash:
          type: boolean
          description: Whether this is a flash secret
        is_voucher:
          type: boolean
          description: Whether this was created using voucher credits
        tx_hash:
          type: string
          description: Gateway/Polygon transaction hash for the secret creation
        tx_hash_execution:
          type: string
          description: Sapphire execution transaction hash for the secret
        is_placeholder:
          type: boolean
          description: 'True when tx_hash is a synthetic fast-reconcile backfill placeholder
            ("0xbbbb"-prefixed, derived from the secret ID) rather than a real gateway
            transaction. Clients must never present it as an actual transaction hash
            or link it to a block explorer.

            '
        secret_type:
          type: integer
          description: Secret type (0=SimpleSecret, 1=ExternalCapsule)
        created_at:
          type: integer
          format: int64
          description: Unix timestamp when the secret was created (block timestamp)
    SecretInfoResponse:
      description: "Complete response body for `GET /api/secrets/info/{id}` \u2014\
        \ the standard signed envelope\nwith the business payload in `data`. Convenience\
        \ type for clients that\nre-parse the raw body into a single struct.\n"
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SecretInfoData'
    SecretGatewayHistoryData:
      description: 'Business payload carried in the `data` field of the standard signed
        response

        envelope (the envelope itself is defined by the operation''s `allOf` with

        `ApiResponse`).

        '
      type: object
      required:
      - history
      properties:
        history:
          type: array
          description: Array of secret history records from Sapphire contract
          items:
            type: object
            required:
            - op_type
            - timestamp
            - actor
            - gateway_message_hash
            - gateway_chain_id
            properties:
              op_type:
                type: integer
                description: Operation type (0=Access, 1=Create, 2=Update, 3=Cancel,
                  4=Destroy)
                enum:
                - 0
                - 1
                - 2
                - 3
                - 4
              timestamp:
                type: integer
                format: int64
                description: Block timestamp when the operation occurred
              actor:
                type: string
                description: Address that performed the operation (relayer or direct
                  caller)
              gateway_message_hash:
                type: string
                description: Gateway message hash for cross-chain correlation (keccak256
                  hash)
              gateway_chain_id:
                type: integer
                format: int64
                description: Origin EVM chain ID (e.g., 80002 for Polygon Amoy)
              gateway_tx_hash:
                type: string
                description: Actual gateway/Polygon transaction hash (empty for direct
                  Access/Destroy operations)
    SecretGatewayHistoryResponse:
      description: "Complete response body for `GET /api/secrets/gateway-history/{id}`\
        \ \u2014 the standard signed envelope\nwith the business payload in `data`.\
        \ Convenience type for clients that\nre-parse the raw body into a single struct.\n"
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SecretGatewayHistoryData'
    VoucherCreditBalanceData:
      description: 'Business payload carried in the `data` field of the standard signed
        response

        envelope (the envelope itself is defined by the operation''s `allOf` with

        `ApiResponse`).

        '
      type: object
      required:
      - user_wallet
      - network
      - balance
      - required
      - has_voucher_system
      properties:
        user_wallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: User's wallet address
        network:
          $ref: '#/components/schemas/PolygonNetworkEnum'
          description: Network identifier
        balance:
          type: string
          description: Current credit balance in USDC (6 decimals)
        required:
          type: string
          description: Required amount for the operation in USDC (6 decimals)
        sufficient:
          type: boolean
          description: Whether balance is sufficient for the operation
        has_voucher_system:
          type: boolean
          description: Whether the network has a deployed voucher system
    VoucherCreditBalanceResponse:
      description: "Complete response body for `GET /api/voucher/credit-balance` \u2014\
        \ the standard signed envelope\nwith the business payload in `data`. Convenience\
        \ type for clients that\nre-parse the raw body into a single struct.\n"
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/VoucherCreditBalanceData'
    PricingData:
      description: 'Business payload carried in the `data` field of the standard signed
        response

        envelope (the envelope itself is defined by the operation''s `allOf` with

        `ApiResponse`).

        '
      type: object
      required:
      - network
      - prices
      - flash_max_duration_seconds
      properties:
        network:
          $ref: '#/components/schemas/PolygonNetworkEnum'
          description: Network identifier
        prices:
          type: object
          description: Operation prices in USDC (6 decimals, raw integer strings)
          required:
          - create
          - create_per_additional_heir
          - update
          - cancel
          - timestamp
          - flash
          - journal
          properties:
            create:
              type: string
              description: Base create-secret price (1 heir)
            create_per_additional_heir:
              type: string
              description: Price added per additional heir
            update:
              type: string
              description: Update/extend price
            cancel:
              type: string
              description: Cancel price
            timestamp:
              type: string
              description: Notary timestamp price
            flash:
              type: string
              description: Flash secret price (via getFlashConfig, not calculatePrice)
            journal:
              type: string
              description: Journal message price per 5KB chunk
        flash_max_duration_seconds:
          type: integer
          description: Maximum flash secret lifetime in seconds
    PricingResponse:
      description: "Complete response body for `GET /api/pricing` \u2014 the standard\
        \ signed envelope\nwith the business payload in `data`. Convenience type for\
        \ clients that\nre-parse the raw body into a single struct.\n"
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/PricingData'
    SubmissionStatusResponse:
      type: object
      required:
      - submission_id
      - status
      properties:
        submission_id:
          type: string
          description: Submission identifier
        secret_id:
          type: string
          description: Secret ID (if available)
        status:
          type: string
          enum:
          - pending
          - processing
          - delivered
          - failed
          - expired
          description: Current delivery status
        operation:
          type: string
          enum:
          - create
          - update
          - cancel
          description: Operation type
        polygon_tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Polygon transaction hash
        sapphire_tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Sapphire transaction hash (if delivered)
        network:
          type: string
          description: Network where operation was submitted
        created_at:
          type: string
          format: date-time
          description: When the event was created
        processed_at:
          type: string
          format: date-time
          description: When processing completed
        error_message:
          type: string
          description: Error details if status is 'failed'
    RelayerInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Relayer-local database ID for this peer entry
        wallet_address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Relayer's registered Ethereum wallet address
        operator_name:
          type: string
          description: Operator display name registered on-chain
        endpoint:
          type: string
          description: Public HTTP(S) base URL of the relayer
        is_healthy:
          type: boolean
          description: True if the peer passed recent health checks
        version:
          type: string
          description: Software version reported by the peer
        is_outdated:
          type: boolean
          description: True if the peer runs an older version than the healthy peer
            quorum
        binary_hash:
          type: string
          description: SHA-256 hash of the binary reported by the peer
        last_health_check_at:
          type: string
          format: date-time
          description: Timestamp of the most recent health check attempt
        last_success_at:
          type: string
          format: date-time
          description: Timestamp of the most recent successful P2P or health communication
        created_at:
          type: string
          format: date-time
          description: Timestamp when this record was first created in the relayer
            database
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this record was last updated
        tx_from:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        started_at:
          type: string
          format: date-time
          description: Timestamp when this relayer instance last started
    RelayersListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      properties:
        data:
          type: array
          description: List of known relayers from the registry
          items:
            $ref: '#/components/schemas/RelayerInfo'
    BlocksResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      properties:
        data:
          type: object
          description: Latest network and processed block numbers for Sapphire and
            monitored Gateway chains
          properties:
            sapphire:
              type: object
              description: Oasis Sapphire block progress
              properties:
                network_block:
                  type: integer
                  description: Latest block number observed on Sapphire RPC
                processed_block:
                  type: integer
                  description: Last Sapphire block processed by this relayer
            gateways:
              type: array
              description: Monitored Gateway chain block progress
              items:
                type: object
                properties:
                  chain_id:
                    type: integer
                    description: Gateway EVM chain ID
                  network_block:
                    type: integer
                    description: Latest block number observed on the gateway chain
                      RPC
                  processed_block:
                    type: integer
                    description: Last gateway block scanned by this relayer
    BootstrapSnapshotInfo:
      type: object
      required:
      - snapshot_hash
      - snapshot_size
      - snapshot_created_at
      - vault_address
      - table_counts
      properties:
        snapshot_hash:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
          description: SHA-256 hash of the snapshot file
        snapshot_size:
          type: integer
          format: int64
          description: Size of the snapshot file in bytes
        snapshot_created_at:
          type: integer
          format: int64
          description: Unix timestamp when the snapshot was created
        vault_address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Sapphire vault contract address (for compatibility check between
            peer and bootstrapper)
        table_counts:
          type: object
          description: Row counts for key tables in the database
          properties:
            events:
              type: integer
              description: Number of Gateway events tracked
            scanned_blocks:
              type: integer
              description: Number of empty blocks cached
            view_records:
              type: integer
              description: Number of gasless access records
            sapphire_transactions:
              type: integer
              description: Number of Sapphire transaction records
            vouchers:
              type: integer
              description: Number of voucher records
            relayers:
              type: integer
              description: Number of known peer relayers
            gateway_transactions:
              type: integer
              description: Number of Gateway payment transaction records
    AutocompleteSecretIdsResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      properties:
        data:
          type: object
          description: Autocomplete matches for the requested secret ID prefix
          required:
          - secret_ids
          properties:
            secret_ids:
              type: array
              items:
                type: string
                pattern: ^0x[a-fA-F0-9]{64}$
              description: List of matching secret IDs (max 6)
    IncomeTransaction:
      type: object
      properties:
        chain:
          type: string
          enum:
          - sapphire
          - polygon
          description: Chain this transaction was mined on
          example: sapphire
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Transaction hash (Sapphire or Polygon)
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        block_number:
          type: integer
          format: int64
          description: Block number in which the transaction was mined
          example: 5234567
        secret_id:
          type: string
          description: Associated secret ID
          example: '0xabcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
        function_selector:
          type: string
          description: Function selector (hex with 0x)
          example: '0x1a2b3c4d'
        event_type:
          type: string
          enum:
          - created
          - accessed
          - extended
          - cancelled
          - updated
          - admin
          - reimbursement
          - journal
          - notary
          description: Vault/gateway operation type
          example: created
        gas_used:
          type: integer
          format: int64
          description: Gas units consumed by the transaction
          example: 50000
        gas_price:
          type: string
          description: Gas price in wei
          example: '100000000000'
        gas_cost:
          type: string
          description: Gas cost in wei (gas_used * gas_price)
          example: '5000000000000000'
        gas_cost_rose:
          type: string
          description: Gas cost in the chain's native token (ROSE on Sapphire, POL
            on Polygon)
          example: '0.005'
        tx_timestamp:
          type: integer
          format: int64
          description: Unix timestamp of the transaction
          example: 1709817600
        tx_status:
          type: string
          enum:
          - success
          - failed
          - pending
          description: Execution status of the transaction
          example: success
        reimbursed:
          type: boolean
          description: Whether this transaction has been reimbursed
          example: true
        reimbursed_tx_hash:
          type: string
          description: Sapphire claim transaction hash (if reimbursed)
          example: '0x9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba'
        claimable:
          type: boolean
          description: Whether this transaction has an on-chain OpRecord and is eligible
            for reimbursement
          example: true
    IncomeKPIs:
      type: object
      properties:
        total_transactions:
          type: integer
          example: 150
          description: Total Sapphire transactions by this relayer
        total_transactions_pol:
          type: integer
          example: 42
          description: Total Polygon gateway transactions by this relayer
        total_gas_cost_rose:
          type: string
          example: '0.7500'
          description: Total gas cost in ROSE
        reward_earned_rose:
          type: string
          example: '0.0375'
          description: Configured markup reward earned in ROSE (e.g. +5.0%)
        reimbursed_rose:
          type: string
          example: '0.7500'
          description: Total reimbursed in ROSE
        pending_reimbursement_rose:
          type: string
          example: '0.0000'
          description: Pending reimbursement in ROSE (includes configured markup)
        claimable_rose:
          type: string
          example: '0.7500'
          description: Claimable reimbursement in ROSE including configured markup
            (has on-chain OpRecord)
        total_gas_cost_pol:
          type: string
          description: Total gas cost in POL (Polygon gateway)
        reward_earned_pol:
          type: string
          description: Configured markup reward earned in POL (Polygon gateway, e.g.
            +5.0%)
        reimbursed_pol:
          type: string
          description: Total reimbursed in POL (Polygon gateway)
        pending_reimbursement_pol:
          type: string
          description: Pending reimbursement in POL including configured markup (Polygon
            gateway)
    MessageRecord:
      type: object
      description: 'A message sent to a wallet via the Sapphire vault''s sendMessage
        function.

        '
      required:
      - tx_hash
      - block_number
      - log_index
      - relayer
      - recipient
      - encrypted_message
      - signature
      - nonce
      - timestamp
      - created_at
      properties:
        tx_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Transaction hash of the MessageSent event
        block_number:
          type: integer
          description: Block number where the event was emitted
        log_index:
          type: integer
          description: Log index within the block
        relayer:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Address of the relayer that submitted the message
        sender:
          type: string
          pattern: ^(0x[a-fA-F0-9]{40})?$
          description: 'True sender (messageOwner) recovered off-chain via ecrecover
            of the stored

            signature. Empty when recovery was not possible (row predates backfill
            or

            the signature is non-canonical).

            '
        recipient:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Address of the message recipient
        encrypted_message:
          type: string
          description: The encrypted message bytes (hex-encoded)
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
          description: EIP-191 signature from the recipient authorizing the message
        nonce:
          type: string
          description: Nonce value (as string for uint256 precision)
        timestamp:
          type: string
          description: Timestamp value (as string for uint256 precision)
        created_at:
          type: string
          format: date-time
          description: When the record was created in the database
    MessagesListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Wallet messages response payload
            properties:
              messages:
                type: array
                items:
                  $ref: '#/components/schemas/MessageRecord'
                description: List of messages for the wallet
    MessagesPagedResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            description: Paginated wallet messages response payload
            required:
            - messages
            - total
            properties:
              messages:
                type: array
                description: Page of matching message records
                items:
                  $ref: '#/components/schemas/MessageRecord'
              total:
                type: integer
                format: int64
                description: Total number of messages matching the filters
                x-go-name: Total
              limit:
                type: integer
                description: Page size limit applied to this response
                x-go-name: Limit
              offset:
                type: integer
                description: Pagination offset applied to this response
                x-go-name: Offset
    WalletPubkeyRegistration:
      type: object
      required:
      - public_key
      - signature
      properties:
        public_key:
          type: string
          pattern: ^0x(02|03)[a-fA-F0-9]{64}$
          description: Compressed secp256k1 public key of the wallet (33 bytes hex)
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
          description: EIP-191 personal_sign signature of MessagePubKeyRegistrationText
            by the wallet
    WalletPubkeyRecord:
      type: object
      required:
      - wallet
      - public_key
      - updated_at
      properties:
        wallet:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Registered Ethereum wallet address (20 bytes hex)
        public_key:
          type: string
          pattern: ^0x(02|03)[a-fA-F0-9]{64}$
          description: Compressed secp256k1 public key (33 bytes hex)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the public key registration was last updated
    WalletPubkeyResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/WalletPubkeyRecord'
