openapi: 3.1.2
info:
  title: Chronolox Relayer API
  description: "API for the Chronolox Relayer service. This service is the operational\
    \ backbone of the\nChronolox protocol: it bridges the Polygon payment layer to\
    \ the Oasis Sapphire TEE\n(Trusted Execution Environment), enables gasless secret\
    \ access for heirs, and acts as\nthe gas sponsor for voucher users who hold no\
    \ cryptocurrency.\n\n## Overview\n\nThe relayer performs **four main functions**:\n\
    \n1. **Event Monitoring**: Watches the Gateway contract on Polygon (and optionally\
    \ BSC/Arbitrum)\n   for secret-related events (`SecretCreatedFromGateway`, `SecretUpdatedFromGateway`,\n\
    \   `SecretCancelledFromGateway`, `FlashSecretCreated`, `VoucherRedeemed`). Each\
    \ authorized\n   relayer instance automatically discovers its shard identity at\
    \ startup and processes only\n   the events assigned to it (`uint256(messageHash)\
    \ % totalRelayers == myIndex`). If the\n   primary owner fails, fallback relayers\
    \ claim it after a staggered wait time\n   (4 + offset minutes), ensuring high\
    \ availability without thundering-herd collisions.\n\n2. **Cross-chain Delivery**:\
    \ Submits signed transactions to Oasis Sapphire to create, update,\n   or cancel\
    \ time-locked secrets on behalf of users. The relayer pays ROSE gas upfront and\
    \ is\n   reimbursed at 105% from the on-chain Gas Reserve Pool, providing a small\
    \ profit margin that\n   makes operating a relayer economically sustainable.\n\
    \n3. **Gasless Secret Access**: Allows recipients (heirs) to retrieve unlocked\
    \ secrets without\n   owning ROSE or any other cryptocurrency. The recipient builds\
    \ an Encrypted Access Envelope\n   client-side (Argon2id hash + relayer binding\
    \ + 8-minute freshness window), submits it to\n   this API, and the relayer forwards\
    \ it to the Sapphire TEE. Gas is paid by the relayer and\n   reimbursed from the\
    \ Gas Reserve Pool.\n\n4. **Voucher Gas Sponsorship**: Non-technical users who\
    \ purchase USDC credit via fiat vouchers\n   (e.g. Stripe checkout) never hold\
    \ any POL (Polygon gas token). The relayer sponsors 100% of\n   Polygon gas for\
    \ all voucher operations \u2014 redemption, secret creation, update, and cancellation.\n\
    \   This cost is absorbed from the fiat margin on voucher sales. The relayer calls\
    \ dedicated\n   `relayedCreateSecret()`, `relayedUpdateSecret()`, and `relayedCancelSecret()`\
    \ functions on\n   the Gateway contract, deducting payment from the user's persistent\
    \ `CreditLedger` balance\n   rather than their wallet.\n\n## Two Creator Archetypes\n\
    \n- **Crypto-native creator** (has wallet, holds USDC): calls the Gateway contract\
    \ directly from\n  their wallet. The relayer picks up the on-chain event and bridges\
    \ to Sapphire automatically.\n  No interaction with this API is required beyond\
    \ `/api/secrets/access` at retrieval time.\n\n- **Voucher user** (no wallet, paid\
    \ with fiat): the Secret Maker app generates a BIP-39 wallet\n  for them, loads\
    \ USDC credit via `VoucherRegistry`, and calls the `/api/voucher/*` endpoints\n\
    \  on this API. The relayer acts as a complete gas proxy \u2014 the user pays\
    \ zero POL and zero ROSE.\n\n## Staking & Authorization\n\nBefore a relayer instance\
    \ can process events or call `relayedCreate/Update/Cancel`, it must:\n1. Complete\
    \ off-chain KYC review by the team (governance proposal via TimelockMultisig).\n\
    2. Stake a minimum of 300 POL on the `RelayerStakingRegistry` contract on Polygon.\n\
    \nThe `RelayerStakingRegistry.isOperational(address)` check gates voucher redemption\
    \ and\nall relayed operations. Use `/api/staking/*` endpoints to manage the staking\
    \ lifecycle.\n\n\n\n## Authentication\n\nMost endpoints are public. The following\
    \ mechanisms are used:\n1. **Response Signing (Server Identity)**: Every JSON\
    \ response (except `/api/health`,\n   `/api/metrics`, `/api/metrics/summary`,\
    \ `/api/bootstrap/snapshot`, `/api/logs/ws`, and\n   `/api/update/binary`) carries\
    \ an ECDSA `signature` field alongside the relayer's wallet\n   (`publicKey`)\
    \ and `version`.\n   To verify response authenticity:\n   1. Construct the canonical\
    \ UTF-8 string `{success}|{timestamp}|{data_json}|{error}|{version}`,\n      where\
    \ `{data_json}` is the compact JSON serialization of `data` (or `null` if absent),\n\
    \      and `{error}` is empty string when absent.\n   2. Hash the canonical string\
    \ with `keccak256` (raw hash, no EIP-191 prefix).\n   3. Recover the secp256k1\
    \ signer address (`ecrecover`) from the 65-byte `signature` and\n      confirm\
    \ it matches `publicKey` (case-insensitive).\n   4. Confirm `publicKey` is an\
    \ authorized relayer in the on-chain registry and check `timestamp`\n      freshness.\n\
    2. **Client Identification (Client Identity, reserved)**: The `BearerAuth` JWT\n\
    \   scheme is reserved for optional client identification (rate-limit tiers,\n\
    \   auditing). It is not enforced yet - no token-issuance endpoint exists and\n\
    \   current handlers ignore the `Authorization` header.\n3. **Secret Access**:\
    \ The `/api/secrets/access` endpoint additionally \n   requires a valid Encrypted\
    \ Access Envelope that binds the recipient's \n   Argon2id password hash to this\
    \ relayer's address.\n\n## Error Handling\n\nAll error responses use a consistent\
    \ envelope:\n\n```json\n{\n  \"success\": false,\n  \"timestamp\": 1710000000,\n\
    \  \"signature\": \"0x...\",\n  \"publicKey\": \"0x...\",\n  \"version\": \"1.0.2\"\
    ,\n  \"code\": \"INSUFFICIENT_CREDIT\",\n  \"error\": \"CreditLedger balance too\
    \ low for create operation\",\n  \"details\": {\n    \"balance\": \"5000000\"\
    ,\n    \"required\": \"10000000\"\n  }\n}\n```\n\n- **`code`** \u2014 stable machine-readable\
    \ value from the `ErrorCode` enum. Clients MUST switch on this field.\n- **`error`**\
    \ \u2014 human-readable string for logs and debugging. May change between versions;\
    \ never parse it.\n- **`details`** \u2014 optional structured payload specific\
    \ to the error code.\n\nHTTP status codes remain the primary classification:\n\
    - `400` \u2014 client errors (validation, bad request, most business-logic failures)\n\
    - `401` / `403` \u2014 authentication / authorization\n- `402` \u2014 insufficient\
    \ credit (always `code: INSUFFICIENT_CREDIT`)\n- `404` \u2014 resource not found\n\
    - `413` \u2014 request body too large (global 4 MB cap; 128 KB on voucher and\
    \ journal write endpoints)\n- `429` \u2014 rate limited\n- `500` / `503` \u2014\
    \ internal or temporary unavailability\n\nSee the `ErrorCode` schema for the complete\
    \ list of codes and their meanings.\n\n## Rate Limiting\n\nRate limits may apply\
    \ per client IP, per wallet, or per secret ID depending on the\nendpoint, and\
    \ per-client limits when a valid `BearerAuth` token is supplied are\nreserved\
    \ for future enforcement (`Authorization` headers are currently accepted and\n\
    ignored). Currently enforced server limits:\n\n- **Baseline public API limit**\
    \ (generated public `/api/*` endpoints plus\n  `/api/bootstrap/snapshot-info`\
    \ and `/api/logs/ws`, excluding `GET /api/health`\n  which is unthrottled, and\
    \ excluding routes with dedicated limiters below):\n  **1,200 requests/hour per\
    \ client IP**. Peer-to-peer routes (`/api/records`,\n  `/api/records/sync`, `/api/records/iblt-sync`,\
    \ `/api/vouchers/sync`,\n  `/api/notary/timestamps/sync`, `/api/dead-letter/notify`,\n\
    \  `/api/bootstrap/snapshot`) share the same bucket with a **10x ceiling\n  (12,000\
    \ requests/hour)** so a relayer fleet behind one egress IP is never\n  mistaken\
    \ for abuse. Non-OpenAPI documentation/utility routes\n  (`/api/sign-auth-request`,\
    \ `/api/docs*`, `/api/explorer*`, `/api/openapi*.yaml`)\n  and `webAuthMiddleware`-protected\
    \ `/api/database/*` routes do not pass through\n  this baseline limiter.\n- **Shared\
    \ rate-limited endpoints** (`/api/voucher/redeem`, `/api/voucher/check`,\n  `/api/notary/timestamp`,\
    \ `/api/wallet/{wallet}/pubkey`, `/api/reprocess/gateway`,\n  `/api/gateway/reprocess`,\
    \ `/api/vouchers/discover`, `/api/update/binary`, and\n  `/api/abuse/report`):\
    \ **50 requests/hour per client IP**.\n- **Secret access** (`/api/secrets/access`):\
    \ **50 requests/hour** on the paid/gas\n  path and **1,000 requests/hour** on\
    \ the cached/already-viewed path, keyed per\n  `secretId` and per client IP. The\
    \ per-`secretId` bucket always enforces; the\n  per-IP buckets ship in observe-only\
    \ mode (see below) and are skipped entirely\n  when the client IP resolves to\
    \ a local reverse proxy.\n- **Voucher secret writes** (`/api/voucher/secret/create`,\
    \ `/update`, `/cancel`):\n  **100 requests/hour per `userWallet`** and **300 requests/hour\
    \ per client IP**;\n  **128 KiB** (`131,072` bytes) request body cap (`413`).\n\
    - **Journal writes** (`/api/journal/entry`): **50 requests/hour per `secret_id`**\
    \ and\n  **120 requests/hour per client IP**; **128 KiB** (`131,072` bytes) request\
    \ body cap (`413`).\n- **Global request body cap**: **4 MiB** across API routes.\n\
    \nExceeding a rate limit returns HTTP `429` (`code: RATE_LIMITED`) with a `Retry-After`\n\
    response header (integer seconds remaining in the current window, minimum `1`).\
    \ Clients should honor\n`Retry-After` or back off exponentially when retrying\
    \ `429` responses.\n\nThe public baseline limiter ships in **observe-only mode**:\
    \ over-threshold requests are\ncounted and logged but still served, so the operator\
    \ can size the ceiling from real\ntraffic before enforcing. Set `relayer.baseline_limiter_mode`\
    \ (env\n`RELAYER_BASELINE_LIMITER_MODE`) to `enforce` to activate `429` responses\
    \ on that\nbucket; the current mode and would-block counters are exported by `GET\
    \ /api/metrics`\n(`relayer_limiter_mode`, `relayer_limiter_would_block_total`).\
    \ Any value other than\n`enforce` behaves as `log`. The admin API baseline limiter\
    \ follows the same pattern\nvia `relayer.admin_general_limiter_mode` (`RELAYER_ADMIN_GENERAL_LIMITER_MODE`),\
    \ as\ndoes the secret-access per-IP bucket via `relayer.access_secret_ip_bucket_mode`\n\
    (`RELAYER_ACCESS_SECRET_IP_BUCKET_MODE`); the per-`secretId` access bucket is\n\
    unaffected by the mode and always enforces.\n"
  version: 1.0.2
  contact:
    name: Frontware International
    url: https://chronolox.com
    email: security@chronolox.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Chronolox documentation and project information
  url: https://chronolox.com
security:
- {}
- BearerAuth: []
servers:
- url: https://relayer.athora.me
  description: TESTNET relayer 1
- url: https://relayer2.athora.me
  description: TESTNET relayer 2
- url: https://relayer3.athora.me
  description: TESTNET relayer 3
tags:
- name: Status & Monitoring
  description: Service status, health, network configuration, and performance metrics.
- name: Events
  description: Gateway event monitoring, history, and delivery tracking across chains.
- name: Secrets
  description: Gasless secret access for heirs and recipients (crypto-native path).
- name: Vouchers
  description: Fiat voucher redemption, credit balance management, and relayed secret
    operations.
- name: Sapphire
  description: Oasis Sapphire TEE interaction endpoints and public key retrieval.
- name: Relayers & Staking
  description: Relayer registry, health monitoring, and staking lifecycle management.
- name: Income
  description: Relayer gas reimbursement tracking and reward analytics.
- name: Messages
  description: "Wallet message inbox \u2014 encrypted messages sent via the Sapphire\
    \ vault."
- name: Notary
  description: Decentralized document timestamping on Polygon via ChronoloxNotary
    contract.
- name: Journal
  description: "Secret Journal entries \u2014 encrypted, append-only diary records\
    \ anchored on-chain via the relayer."
- name: Pricing
  description: Protocol operation pricing (Credit/USDC prices per operation type).
paths:
  /api/health:
    get:
      tags:
      - Status & Monitoring
      summary: Health Check
      operationId: health
      description: 'Simple liveness probe that returns {"ok":true}. This endpoint
        has NO middleware,

        NO authentication, NO response envelope, NO database query, and NO signature.

        It''s designed for container orchestrators (Kubernetes, Docker) to check if
        the

        relayer process is running.

        '
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: True when the relayer HTTP process is alive
                    example: true
              example:
                ok: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing the invalid request
              example:
                error: invalid request
  /api/blocks:
    get:
      tags:
      - Status & Monitoring
      summary: Get Block Information
      operationId: getBlocks
      description: 'Returns the latest known block numbers for Oasis Sapphire and
        each monitored EVM Gateway

        chain. Useful for dashboards and monitoring tools to quickly verify the relayer
        is keeping

        up with chain head and has not stalled behind a reorg or RPC outage.

        '
      responses:
        '200':
          description: Block information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocksResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  sapphire:
                    network_block: 5234567
                  gateways:
                  - chain_id: 80002
                    network_block: 4567890
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/status:
    get:
      tags:
      - Status & Monitoring
      summary: Get relayer operational status
      operationId: getStatus
      description: 'Returns operational health information about the relayer including:

        - Uptime and version information

        - Relayer wallet address and balances

        - Gateway monitoring status

        - Staking information

        - Event processing statistics


        For performance metrics (call volume, success rates, peer performance),

        use `/api/metrics/summary`.


        **Binary hash (P2P auto-update):** The `binary_hash` field is the SHA-256
        of the running

        executable. Peer relayers include this in their quorum check before auto-updating:
        a minimum

        of MAX(1, MIN(2, peers)) must advertise the same `(version, binary_hash)`
        tuple before an

        update is downloaded and applied.


        **Relayer staking:** The `relayer_staking` block reports the on-chain state
        from the

        Polygon-side `RelayerStakingRegistry` contract: minimum required stake, total
        POL currently

        locked across all operators, and how many relayers are in OPERATIONAL state.


        **Wallet balances:** The `rose_balance` and `pol_balance` fields are the relayer''s
        own

        wallet balances. `rose_balance` funds Sapphire gas for bridging secrets. `pol_balance`
        funds

        Polygon gas for voucher operations (relayed create/update/cancel/redeem).
        Alert thresholds are

        configurable via `TELEGRAM_ROSE_WARN_THRESHOLD` / `TELEGRAM_POL_WARN_THRESHOLD`.

        '
      responses:
        '200':
          description: Current status information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  uptime_seconds: 3600.5
                  relayer_address: '0x1234567890123456789012345678901234567890'
                  binary_hash: a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890
                  built: '2026-03-24T08:15:58Z'
                  version: 1.0.0
                  update_available: false
                  latest_version: 1.0.0
                  update_checked_at: '2026-03-30T05:12:00Z'
                  stats:
                    total: 150
                    delivered: 145
                    pending: 3
                    failed: 2
                  gateways:
                  - network: polygonAmoy
                    chain_id: 80002
                    gateway: '0xabcdef0123456789abcdef0123456789abcdef01'
                    last_block: 4567885
                    is_active: true
                  relayer_staking:
                    address: '0x5F7915656056e344678CDa055b057F2B8cE43EA6'
                    min_stake: 300 POL
                    total_locked: 1200 POL
                    operational_count: 4
                    lock_duration: 7 days
                  rose_balance: '250.2500'
                  pol_balance: '150.5000'
                  started_at: '2024-03-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/contracts/addresses:
    get:
      tags:
      - Status & Monitoring
      summary: Get contract addresses for a blockchain
      operationId: getContractAddresses
      description: 'Returns the Gateway and PricingRegistry contract addresses for
        a specified blockchain.

        The Gateway address is discovered dynamically from the Sapphire contract''s
        `authorizedGateways()`

        mapping, while the PricingRegistry address is returned from SDK configuration
        (if deployed).


        **Supported networks:** polygon, polygonAmoy, bsc, bscTestnet

        '
      parameters:
      - name: blockchain
        in: query
        description: Blockchain network identifier
        schema:
          type: string
          default: polygon
          enum:
          - polygon
          - polygonAmoy
          - bsc
          - bscTestnet
        example: polygonAmoy
      responses:
        '200':
          description: Contract addresses retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractAddressesResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  blockchain: polygonAmoy
                  chain_id: 80002
                  gateway_address: '0xABCDEF0123456789ABCDEF0123456789ABCDEF01'
                  pricing_registry_address: '0xAE7138373A1a4b58446B80218666C36483ff1Dc0'
                  has_pricing_registry: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/metrics/summary:
    get:
      tags:
      - Status & Monitoring
      summary: Get relayer performance metrics
      operationId: getMetricsSummary
      description: "Returns performance metrics for monitoring dashboards including:\n\
        - KPIs (24h call volume, success rates, latency)\n- Time-series call volume\
        \ data\n- Breakdown by blockchain\n- Breakdown by peer\n\nFor operational\
        \ health (status, balances, gateway info), use `/api/status`.\n\n**Response\
        \ format:** Returns pre-aggregated dashboard metrics without the standard\
        \ JSON\nenvelope, so the relayer's own frontend can consume them directly\
        \ without an extra\nunwrapping step.\n\n**KPI fields:**\n- `total_calls_24h`\
        \ \u2014 all inbound + outbound API calls in the last 24 hours.\n- `success_rate_1h`\
        \ / `success_rate_24h` \u2014 fraction of calls that returned a non-error\n\
        \  response, over 1-hour and 24-hour windows respectively.\n- `median_latency_ms_5m`\
        \ \u2014 p50 response latency over the last 5 minutes; useful for\n  detecting\
        \ Sapphire RPC degradation before it causes delivery failures.\n- `active_peers_1h`\
        \ \u2014 number of peer relayers that have successfully exchanged P2P\n  records\
        \ with this instance in the last hour.\n\n**Time-series data:** `call_volume`\
        \ returns per-bucket inbound/outbound/failed call\ncounts. The bucket interval\
        \ is determined by the relayer's internal aggregation window.\n\n**Per-blockchain\
        \ and per-peer breakdowns** allow operators to identify which Gateway\nchain\
        \ or peer relayer is contributing disproportionate failures.\n"
      parameters:
      - name: range
        in: query
        description: Time range in seconds to aggregate metrics over
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Metrics summary data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummaryResponse'
              example:
                generated_at: 1709817600
                range_label: Last 24h
                kpis:
                  total_calls: 1560
                  inbound_calls: 890
                  outbound_calls: 670
                  success_rate: 0.992
                  success_rate_1h: 0.985
                  median_latency_ms: 142
                  active_peers: 4
                  failed_calls_1h: 2
                call_volume:
                - ts: 1709780000
                  inbound: 45
                  outbound: 32
                  failed: 0
                by_blockchain:
                - blockchain: polygonAmoy
                  calls: 12500
                  success_rate: 0.99
                by_peer:
                - peer_id: '0x1234567890abcdef1234567890abcdef12345678'
                  calls_24h: 450
                  success_rate: 0.98
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/events:
    get:
      tags:
      - Events
      summary: List Processed Events
      operationId: listEvents
      description: 'Returns Gateway events that this relayer has processed or is tracking,
        along with a list

        of empty blocks that were scanned. The `scanned_blocks` array lets peer relayers
        skip

        RPC queries for blocks already confirmed to contain no relevant events, reducing

        unnecessary Polygon/BSC node load during P2P sync.


        Each event record carries `is_flash` and `is_voucher` flags so consumers can
        distinguish

        protocol-paid secrets from flash secrets (one per wallet, capped at 7 days)
        and

        voucher-credit secrets (paid via fiat CreditLedger balance rather than a direct
        USDC

        wallet transfer).


        Supported event names: `SecretCreatedFromGateway`, `SecretUpdatedFromGateway`,

        `SecretCancelledFromGateway`, `SecretMetadataStored`, `SecretMetadataUpdated`,

        `FlashSecretCreated`, `VoucherRedeemed`.

        '
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - delivered
          - failed
          - permanently_failed
        description: Filter by event status
      - name: secret_id
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{1,64}$
        description: Filter by secret ID (hex string, 1-64 chars)
      - name: chain
        in: query
        schema:
          $ref: '#/components/schemas/NetworkEnum'
        description: Filter by blockchain network
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of event records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
