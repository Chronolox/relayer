  /api/voucher/redeem:
    post:
      tags:
      - Vouchers
      summary: Redeem Voucher
      operationId: redeemVoucher
      description: "Redeems a fiat-purchased voucher code and loads the equivalent\
        \ USDC credit into the\nuser's on-chain `CreditLedger` balance. This is the\
        \ entry point for the fiat-to-credit\nflow: a non-technical user buys a voucher\
        \ via Stripe, receives a code by email (format\n`CLX-XXXX-XXXX-XXXX-XXXX`,\
        \ 128-bit entropy), enters it in the Secret Maker app, and\ncalls this endpoint.\n\
        \n**Sapphire TEE encryption (v0.9):** The voucher code MUST be encrypted client-side\
        \ using\n`EncryptForSapphire()` before being sent to this endpoint. The encrypted\
        \ payload is a\nhex-encoded X25519+Deoxys-II envelope that can only be decrypted\
        \ inside the Sapphire TEE.\nThe relayer forwards the payload to `SecretVaultSapphire.tssDecryptCode()`,\
        \ receives\nthe plaintext code back via the `VoucherCodeDecrypted` event (visible\
        \ only to the relayer),\nand then calls `VoucherRegistry.redeem()` on Polygon.\
        \ The relayer never sees the plaintext\nvoucher code.\n\n**On-chain hashing:**\
        \ The `VoucherRegistry.redeem(string,address)` function hashes the\nplaintext\
        \ code on-chain via `keccak256(abi.encodePacked(code))` rather than accepting\
        \ a\npre-computed `bytes32` hash \u2014 preventing a compromised relayer from\
        \ sweeping unredeemed\nvouchers by substituting arbitrary code hashes.\n\n\
        The relayer:\n1. Forwards the encrypted payload to the Sapphire TEE via `tssDecryptCode()`.\n\
        2. Parses the `VoucherCodeDecrypted` event to obtain the plaintext code.\n\
        3. Calls `VoucherRegistry.redeem(code, wallet)` on Polygon with the raw code\
        \ string,\n   **sponsoring 100% of POL gas** from its own wallet. The user\
        \ holds zero POL.\n4. The `VoucherRegistry` contract hashes the code and marks\
        \ it as redeemed, then calls\n   `CreditLedger.credit(wallet, amount)`, loading\
        \ USDC into the user's persistent balance.\n5. The user can now create, update,\
        \ and cancel secrets by calling `/api/voucher/secret/*`\n   endpoints \u2014\
        \ all gas is sponsored by the relayer, deducting from this credit balance.\n\
        \n**Rate limit:** 3 redemption attempts per hour per wallet address to prevent\
        \ code brute-force.\n\n**Credit persistence:** The `CreditLedger` balance\
        \ is on-chain and permanent. Unused\ncredit carries over indefinitely. Topping\
        \ up is possible by redeeming a second voucher.\n\n**Staking requirement:**\
        \ Only relayer instances in OPERATIONAL state (staked \u2265 300 POL on\n\
        `RelayerStakingRegistry`) may call `VoucherRegistry.redeem()`. If the relayer's\
        \ staking\nstatus changes, voucher redemption will fail until re-staked.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherRedeemRequest'
            example:
              encryptedPayload: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
              wallet: '0x1234567890123456789012345678901234567890'
              network: polygonAmoy
      responses:
        '200':
          description: Voucher redeemed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherRedeemResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  tx_hash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  usdc_credited: '10000000'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/voucher/secret/create:
    post:
      tags:
      - Vouchers
      summary: Create Secret for Voucher User
      operationId: voucherCreateSecret
      description: "Creates a time-locked secret on behalf of a voucher user who holds\
        \ a USDC balance in\n`CreditLedger`. This is the voucher-path equivalent of\
        \ a direct wallet `createSecret()`\ncall. The user never interacts with the\
        \ blockchain directly.\n\n## Payment flow\n\nThe relayer calls `SecretVaultSapphireGateway.relayedCreateSecret(userWallet,\
        \ ...)` on\nPolygon, sponsoring the POL gas itself. Inside that contract call:\n\
        1. `CreditLedger.deduct(userWallet, price, \"create\", numHeirs)` validates\
        \ the amount\n   against `PricingRegistry.calculatePrice(\"create\", numHeirs)`\
        \ and deducts from the\n   user's on-chain balance.\n2. `CreditLedger.transferToSplit(price)`\
        \ forwards the USDC to `SplitRegistry`, which\n   distributes revenue identically\
        \ to the direct-wallet path\n   (40% team / 20% investors / 37% llc ops /\
        \ 3% gas pool).\n3. The relayer picks up the emitted `SecretCreatedFromGateway`\
        \ event and bridges the\n   encrypted payload to Oasis Sapphire.\n\nThe `userWallet`\
        \ parameter replaces `msg.sender` throughout \u2014 all rate limiting, nonce\n\
        tracking, and `secretId` derivation use the user's wallet, not the relayer's.\n\
        \n## Content encryption\n\n`encryptedContent` must be a V1 Hybrid KEM blob\
        \ (1-byte version tag `0x01` + 1568-byte\nML-KEM-1024 ciphertext + 32-byte\
        \ X25519 ephemeral key + 24-byte XSalsa20 nonce +\nciphertext). Fetch the\
        \ TEE's X25519 and ML-KEM-1024 public keys before encrypting;\nthe 100 KB\
        \ plaintext limit applies to the pre-encryption content.\n\n## HTTP 402 \u2014\
        \ Insufficient credit\n\nIf the user's `CreditLedger` balance is below `PricingRegistry.calculatePrice(\"\
        create\", numHeirs)`,\nthe endpoint returns HTTP 402 with `balance` (current\
        \ balance, 6 decimals) and `required`\n(required amount, 6 decimals) so the\
        \ app can prompt the user to top up via another voucher.\n\n## Effective size\
        \ limit\n\nThe server enforces a 128 KiB cap on the entire request body of\
        \ this endpoint (checked\nbefore validation) and returns HTTP 413 when it\
        \ is exceeded. Requests approaching the\nschema-level maximum for `encryptedContent`\
        \ (204,800 characters) therefore cannot fit\nand are rejected with 413; the\
        \ practical ceiling is the body cap.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherCreateSecretRequest'
            example:
              userWallet: '0x1234567890123456789012345678901234567890'
              signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
              nonce: 42
              deadline: 1735690200
              numHeirs: 3
              unlockTime: 1735689600
              accessWindowEnd: 1735689900
              autoDestroy: false
              encryptedContent: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
              argon2Hashes:
              - '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
              - '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
              - '0x9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba'
              saltS: '0x1234567890abcdef1234567890abcdef'
              saltA: '0x1234567890abcdef1234567890abcdef'
              revealThreshold: 2
              encryptedMetadata: '0x5678ef01'
              secretType: 0
              isFrozen: false
              isFlash: false
              encryptedContentKeys:
              - '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
              - '0x9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba'
              storeApprovals: true
              contentKeyHash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      responses:
        '200':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherSecretResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  submissionId: polygonAmoy-20240307-153000
                  secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  status: relayed
                  polygonTxHash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  sapphireTxHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/voucher/secret/update:
    post:
      tags:
      - Vouchers
      summary: Update Secret for Voucher User
      operationId: voucherUpdateSecret
      description: "Updates a time-locked secret (content, unlock time, or access\
        \ window end) on behalf of a\nvoucher user. The relayer sponsors POL gas and\
        \ deducts `PricingRegistry.updatePriceUsd`\n(~$2.00 USDC) from the user's\
        \ `CreditLedger` balance.\n\nThis endpoint wraps the unified `updateSecret()`\
        \ Gateway function (v6+). Pass `0` or empty\nbytes for any field you do not\
        \ want to change \u2014 at least one of `newEncryptedContent`,\n`newUnlockTime`,\
        \ or `newAccessWindowEnd` must be non-zero/non-empty.\n\n**Sapphire TEE constraints\
        \ (authoritative \u2014 Gateway-side checks are convenience only):**\n- `isFrozen\
        \ = true` \u2192 all mutations permanently blocked; call reverts.\n- `isFlash\
        \ = true` \u2192 all mutations permanently blocked.\n- Content update \u2192\
        \ only for `SimpleSecret` type; `ExternalCapsule` content is immutable\n \
        \ (the decryption key is already bound to physically distributed encrypted\
        \ files).\n- `newUnlockTime` \u2192 must be strictly greater than the current\
        \ stored value (forward-only).\n- `newAccessWindowEnd` \u2192 must be strictly\
        \ greater than the current value and strictly\n  after the (possibly updated)\
        \ `newUnlockTime`. Cannot be added post-creation.\n\nHTTP 402 is returned\
        \ if the `CreditLedger` balance is below the update fee.\n\n## Effective size\
        \ limit\n\nThe server enforces a 128 KiB cap on the entire request body of\
        \ this endpoint (checked\nbefore validation) and returns HTTP 413 when it\
        \ is exceeded. Requests approaching the\nschema-level maximum for `newEncryptedContent`\
        \ (204,800 characters) therefore cannot fit\nand are rejected with 413; the\
        \ practical ceiling is the body cap.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherUpdateSecretRequest'
            example:
              userWallet: '0x1234567890123456789012345678901234567890'
              signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
              nonce: 42
              deadline: 1735690200
              network: polygonAmoy
              secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
              newEncryptedContent: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
              newUnlockTime: 0
              newAccessWindowEnd: 0
      responses:
        '200':
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherSecretResponse'
              example:
                success: true
                timestamp: 1709817600
                signature: '0xa3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1b0'
                publicKey: '0xB7C0a4Ae447FcEfF8B686dE6d7CcC6FdD9eb946b'
                version: 1.0.0
                data:
                  submissionId: update-1234567890abcdef
                  secretId: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  status: updated
                  polygonTxHash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  sapphireTxHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
